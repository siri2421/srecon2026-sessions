 and observability We then discuss how each step we took improved our security incident response to multiple attacks after the initial security incident, showing our defence in depth approach in action. Finally we discuss our plans for future security improvements and how \"defence in depth\" is not a destination but a continuous practice. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Tony Leopold and Philip Hope (Grafana Labs) outlines the production architecture and failure mitigations:\nwondering why your P99 latency looks like a heart monitor, you may well have been looking at some of our stuff. That's Loki for logs, Grafana for visualization, Tempo for traces, and Amira for metrics. At that scale, security can't just be somebody reading YAML, right. Our contributors can be strangers by design, and most of them are wonderful.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "66cA5b_Q0Os", "title": "Do Startups Have Time for STAMP's Controlling Ways?", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "66cA5b_Q0Os", "recording_link": "https://www.youtube.com/watch?v=66cA5b_Q0Os", "company": "Modal Labs", "speaker": "Jonathon Belotti", "word_count": 8218, "has_transcript": true, "premise": "We all know that speed trades off against reliability\u2014haste makes waste. But is a new Pareto frontier in in speed and reliability not possible? In the midst of this AI boom, startups really want to find it. 10 years ago Professor Leveson at MIT proposed STAMP, a recombination of systems and control theory for application in engineering reliability. STAMP is a better theory but primed for transplant rejection if dropped into a scaling startup. In the talk, I'll walk through how I embraced it but then stripped it down for selling into a startup engineering group which is always in a hurry. Faster, safer\u2014choose two. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Jonathon Belotti (Modal Labs) outlines the production architecture and failure mitigations:\nUh we call ourselves the platform for production AI. So this is another growth chart, this time showing just incidents. Uh it starts at 2025, a shorter timeline, because it was in like sort of the mid 2025 that we started tracking incidents in Datadog's incident tracking product and also categorizing incidents by their severity. Then we introduced your classic sev one through sev four, sev one being the worst, sev four being something that's okay, a minor incident affecting one product, maybe a handful of customers.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "18yKD3b1OXE", "title": "Freezing the Firehose: Forensic Engineering in the Age of...", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "18yKD3b1OXE", "recording_link": "https://www.youtube.com/watch?v=18yKD3b1OXE", "company": "Octopus Deploy", "speaker": "Cail Young", "word_count": 6444, "has_transcript": true, "premise": "Depending on where you draw the line, it took 30-100 years for transport safety regulators to land on a universal approach to post-incident telemetry recovery using data recorders. Can we do better than that with modern software systems? In 2025, a team at Octopus Deploy was tasked with building out a multi-region, highly-available, OpenTelemetry-based telemetry processing platform. Part of that project was to explore how to avoid the tradeoff of throwing away telemetry through sampling by storing all of the data, at least for some time. This talk presents a working record-and-replay system using a combination of the contributed file exporter, file receiver, and a Kubernetes Job-based replay system, and will discuss the misadventures involved in scaling up to production volumes of telemetry. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Cail Young (Octopus Deploy) outlines the production architecture and failure mitigations:\nUm I currently work as an SRE at a company called Octopus Deploy where we make a continuous deployment tool if that's the kind of thing that interests you. But I'm actually not here to talk about deployments today. But anyway, our team has built using only open source technologies a reasonably affordable way to house at least a few days worth of span data, which lets us go back in time after an incident and learn a bit more about what what happened. It wasn't always helpful for certain classes of problem.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "Pp028UHm8Eo", "title": "How Uber Validates Failover Resilience in Production", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "Pp028UHm8Eo", "recording_link": "https://www.youtube.com/watch?v=Pp028UHm8Eo", "company": "Uber", "speaker": "Johan Mena and Albert Wang", "word_count": 4946, "has_transcript": true, "premise": "Can your company survive a regional failover? Company-wide failover drills answer that question, but they're operationally expensive to run, leaving long gaps for a bad deploy to quietly break your resilience. Staging won't save you either; you and I both know it's a lie since it can never match a complex system's real traffic and environment. This is the story of how we built Muttloader at Uber to validate failover resilience directly in production. We'll cover Muttloader's core traffic control mechanism for inducing higher load on services, the monitoring system that allows it to run safely in production, and what we learned from running tens of thousands of tests over five years of operation. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Johan Mena and Albert Wang (Uber) outlines the production architecture and failure mitigations:\nThat Halloween weekend, which by the way we're getting close to plus five years, seven years, on a Friday, which is our busiest day of the week, the database that tracks orders failed in one of the two regions. It was generally a pretty bad incident. So, this incident proved that resilience to failovers was necessary for business continuity. We're part of production engineering at Uber, which is our flavor of SRE.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "tidiqDjxAmM", "title": "How We Troubleshoot Difficult Problems: Cognition and...", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "tidiqDjxAmM", "recording_link": "https://www.youtube.com/watch?v=tidiqDjxAmM", "company": "N/A", "speaker": "Laura Nolan", "word_count": 8218, "has_transcript": true, "premise": "Troubleshooting is one of the hardest parts of software operations. Observability tools show us system state, but rarely how it got there. Problems may be intermittent, difficult to reproduce, or involve systems that are slow rather than broken. We work under uncertainty and time pressure, often without a complete understanding of the system. So how do expert troubleshooters actually do this work? This talk combines research on \u201ccognition in the wild\u201d across complex domains with my own research into troubleshooting practices in software operations to explore what effective troubleshooting looks like. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Laura Nolan (N/A) outlines the production architecture and failure mitigations:\nUm not the sort of you know here is how you should do it but what actually happens in the real world with troubleshooting incidents. Uh I was the incident commander for uh this incident and I wrote a big public blog post about it as well. Um I was the incident commander when Amazon had the big fire last October. So um I'm going to talk a little about incidents and issues.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "62kRg0YRiLc", "title": "Incident Response & AI - The Hard Parts", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "62kRg0YRiLc", "recording_link": "https://www.youtube.com/watch?v=62kRg0YRiLc", "company": "Adaptive Capacity Labs, and Stuart Rimell, Uptime Labs", "speaker": "John Allspaw", "word_count": 7108, "has_transcript": true, "premise": "The tech industry is rushing to inject Generative AI into incident management\u2014promising automated incident commanders, autonomous root-cause summarizers, and instant remediations. However, cognitive systems engineering demonstrates that high-consequence incident response is fundamentally an exercise in human joint cognitive systems: coordinating under uncertainty, maintaining shared mental models, and synthesizing tacit context that never exists in structured telemetry. Naive AI tooling risks creating automation surprises, cognitive friction, and dangerous deskilling during critical outages.", "technical_depth": "John Allspaw (Adaptive Capacity Labs) and Stuart Rimell (Uptime Labs) analyze incident coordination dynamics through cognitive science:\n1. The Automation Paradox: As automation handles simple, routine failures, the incidents that escalate to humans are exponentially more complex, novel, and ambiguous\u2014precisely the scenarios where generative models fail most catastrophically.\n2. Shared Mental Models vs. Information Flood: In high-stress triage, human responders need signal compression, not LLM-generated essays. Verbose auto-summaries clog communication channels and force responders to spend precious cognitive bandwidth auditing the AI's hallucinations.\n3. The Tacit Knowledge Gap: Production outages rarely stem from isolated code bugs; they emerge from recent organizational changes, unspoken workarounds, and cross-team dependencies that exist solely in human memory and cannot be retrieved by RAG bots.\n4. Cognitive Scaffolding: Structuring AI's role strictly as a non-authoritative cognitive assistant\u2014transcribing timeline milestones, organizing disparate Slack threads, and fetching known runbook pointers without attempting autonomous mitigation.", "takeaways": "\u2022 **Do Not Automate Judgment:** Keep human operators in the loop for diagnosis and strategic mitigation; use AI exclusively for mechanical telemetry collation and transcription.\n\u2022 **Beware the Cost of Verification:** If validating an AI's proposed diagnosis takes longer than running standard diagnostic commands, the tool decreases overall incident resilience.\n\u2022 **Design for Coordination, Not Replacement:** Effective incident tooling improves visibility between engineers; tools that attempt to replace human communication obscure vital diagnostic intuition.\n\u2022 **Post-Incident Analysis Over Real-Time Synthesis:** Generative models are significantly more effective at aiding retrospective timeline assembly post-incident than making snap judgments in the heat of a live outage.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "mZW8vipp0Cw", "title": "Monitoring a Telco", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "mZW8vipp0Cw", "recording_link": "https://www.youtube.com/watch?v=mZW8vipp0Cw", "company": "emnify", "speaker": "Dr. Steffen Gebert", "word_count": 5553, "has_transcript": true, "premise": "Learn about cellular connectivity and how your phone can roam in Ireland as you watch this presentation - and the challenges of emnify as cellular operator for IoT connectivity monitoring SIM cards across the world. As millions of Prometheus metrics were not enough to understand the impact of incidents, we had to change gears to level up our monitoring. The major part of the presentation describes our approach to overcome the limitation from traditional applications monitoring. We transformed signalling requests and responses from individual packets on the wire into an infinite stream of events. Using Apache Flink as stream processing framework helped us to gain reliable data and enrich with necessary context about customers and network operators. We are confident that similar approaches can be also applied to systems outside of the telco industry. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Dr. Steffen Gebert (emnify) outlines the production architecture and failure mitigations:\nTo cater for global use cases, we have deployed our core network globally across seven and soon eight AWS regions. We're not getting a couple of millions dollars of network equipment shipped with a monitoring solution integrated. Further, I will talk about stream processing because it's the well, paradigm that we apply to our monitoring problem and maybe you have similar challenges with your own environment. And the project that I'm currently working on is like really it's something that I need to present and I was really so energized mentally, not physically, um that I thought, yes that's definitely something for an SRE con and for whatever reason March 31st I took this picture to show it to you one and a half years later um it worked out great to be here together with you um so you will hear the story about my personal involvement is and how we actually leveled up our monitoring not through iterative improvements but by like really taking a completely different approach.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "1ZuvNJC7qY8", "title": "The Things That Didn't Work: Hard Lessons from Building...", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "1ZuvNJC7qY8", "recording_link": "https://www.youtube.com/watch?v=1ZuvNJC7qY8", "company": "BlackRock", "speaker": "Uri Morris", "word_count": 3182, "has_transcript": true, "premise": "SRE success stories often focus on dashboards, error budgets, and incident reduction. This talk focuses on the harder part: what didn\u2019t work. Over four years, we grew SRE from a one-person experiment into a practice spanning twenty domains across a large-scale financial technology platform. Along the way, we learned that telemetry coverage is not observability readiness, SRE titles do not create SRE mindsets, and leadership engagement matters more than staffing models. This session shares the uncomfortable lessons behind the wins: noisy dashboards nobody used, postmortems filed but not owned, domains where SRE created the illusion of coverage without improvement, and the governance changes that finally made the model scale. Attendees will leave with practical diagnostic questions, expansion gates, and patterns for building SRE as a culture, not just a role. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Uri Morris (BlackRock) outlines the production architecture and failure mitigations:\nUh I'm going to go through in this session how we scaled SRE at Black Rock. So we had a lot of domains where metrics were were emitted, uh dashboards had been built, um primarily for like demos and like POCs. Um so when we were doing retros and you know luckily we have some of this captured in our structured data in our incident metrics which is if a tool was used during an if a telemetry tool was used during an incident what was the telemetry tool. Um and did we self-identify the uh the incident before our clients.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "nCvzIUGHaSs", "title": "Three Lies We Tell Ourselves about Disaster Recovery and...", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "nCvzIUGHaSs", "recording_link": "https://www.youtube.com/watch?v=nCvzIUGHaSs", "company": "Resilience in Software Foundation", "speaker": "Colette Alexander", "word_count": 2753, "has_transcript": true, "premise": "While many engineers and leaders participate in and sponsor disaster recovery (DR) activities at their companies, few ever need to wrestle with whether their DR systems will work in reality. This is because of the resilience and robustness of the systems they work within (and maybe a bit of luck). But what if we needed to use our DR plans in reality one day? What would happen then? Using real-life stories from the movies, the US defense department, and nuclear power we can illuminate what some of the weaknesses of our own DR plans are, and then come up with tactical and philosophical approaches to making DR exercises better for everyone. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Colette Alexander (Resilience in Software Foundation) outlines the production architecture and failure mitigations:\nOf course, before they tried it out, they picked a a date in the future, they trained a bunch of people on how to do the incident response like in their disaster plan. Bus drivers who were tasked with picking up children from school and taking them to a predetermined rally point refused to drive their specifically designated emergency routes and were unable to read their dosimeters to check for radiation exposure. It's called Prosaic Organizational Failure. So you need to talk to people who manage incidents on the ground.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "1QhizVV_YQQ", "title": "When Two Services Become One: Untangling a Distributed Monolith", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "1QhizVV_YQQ", "recording_link": "https://www.youtube.com/watch?v=1QhizVV_YQQ", "company": "GetYourGuide", "speaker": "Ayush Kumar", "word_count": 5119, "has_transcript": true, "premise": "Two of our core services had quietly become a distributed monolith: neither could function without the other, core data was duplicated across four systems, and recovering from incidents meant coordinating three teams and waiting for databases to sync. This talk is a practitioner's retrospective on how we got there \u2014 and how we got out. We'll walk through the four telltale signs of a distributed monolith, the five architectural decisions we made to fix it (including replacing async replication with GraphQL resolution and consolidating status flags into a single computed field), and the migration strategy that let us cut over without a big-bang release: six weeks of shadow mode and a staged rollout ladder from 1% to 100% of traffic. If you've inherited services whose boundaries feel wrong but you're afraid to touch them, this talk is for you. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Ayush Kumar (GetYourGuide) outlines the production architecture and failure mitigations:\nOn call, the things which started creating problems for us, then how did we created a task force to investigate and come up with solutions. And how did we roll out such big architectural changes without breaking anything in the production. So, when we first designed the services, we designed it like this that one service was managing the availability and pricing where we are getting directly from the suppliers. So, we basically design our services by not what they manage, but how they are integrated.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "D9-zjWx81zs", "title": "Who Owns the Incident? The Hidden Costs of Centralized vs. ...", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "D9-zjWx81zs", "recording_link": "https://www.youtube.com/watch?v=D9-zjWx81zs", "company": "Enova International", "speaker": "Ana Lebr\u00f3n", "word_count": 5280, "has_transcript": true, "premise": "Engineering organizations face a persistent organizational tug-of-war during major production outages: Should incidents be owned centrally by dedicated SRE/NOC incident commanders, or decentralized to the embedded software engineering squads who wrote the code? Centralized command creates communication bottlenecks and lacks service-specific domain depth, while decentralized triage leads to chaotic coordination, inconsistent severity ratings, and severe cross-service blind spots during cascade failures.", "technical_depth": "Ana Lebr\u00f3n (Enova International) analyzes the quantitative and operational tradeoffs of incident ownership models:\n1. The Centralized Bottleneck: Dedicated SRE incident commanders excel at communication cadence and process adherence, but struggle with complex business logic bugs, requiring multiple handoffs that inflate Mean Time to Mitigate (MTTM).\n2. The Decentralized Chaos: Autonomous squad triage enables rapid root-cause isolation for isolated component bugs, but catastrophically degrades during systemic outages involving shared databases, API gateways, or third-party payment rails.\n3. The Hybrid Dynamic Handoff Model: Establishing a protocol-driven operational perimeter where product teams command initial triage for scoped single-service alerts, with automated escalation triggers transferring incident command to central SRE when multi-service blast radiuses or latency SLO breaches are detected.\n4. Standardized Incident Tooling: Implementing automated Slack channel provisioning, role assignment (Commander, Scribe, Communications Lead), and real-time status page syncing decoupled from specific team preferences.", "takeaways": "\u2022 **Match Ownership to Blast Radius:** Single-service defects belong to product teams; cross-boundary cascade failures mandate central SRE command.\n\u2022 **Eliminate Commander Ambiguity:** The role of Incident Commander must be explicitly acknowledged in the incident channel within 5 minutes of page to prevent diffusion of responsibility.\n\u2022 **Decouple Triage from Communication:** The engineer driving mitigation must never be burdened with executive status updates; split technical lead and communications lead roles immediately.\n\u2022 **Continuous Incident Command Drills:** Train product engineers in basic incident command protocols so that handoffs to central SRE are seamless and frictionless.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "11WF7v1NLpY", "title": "Lightning Talks", "category": "Lightning Talks & Production War Stories", "topic": "Lightning Talks & Production War Stories", "type": "Breakout", "video_id": "11WF7v1NLpY", "recording_link": "https://www.youtube.com/watch?v=11WF7v1NLpY", "company": "USENIX SRE Community", "speaker": "Various Speakers", "usenix_url": "https://www.usenix.org/conference/srecon26americas", "conference": "SREcon26 Americas", "premise": "High-velocity technical lightning talks presented live at SREcon26 Americas covering systems architecture, production war stories, and tooling breakthroughs.", "technical_depth": "Various Speakers (USENIX SRE Community) explores production systems architecture and reliability mechanisms:\n\nHigh-velocity technical lightning talks presented live at SREcon26 Americas covering systems architecture, production war stories, and tooling breakthroughs.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 18, "has_transcript": true}, {"session_id": "z7Q5mctqTRU", "title": "Lightning Talk - Blocking Accidental Disk Wipes with eBPF", "category": "Lightning Talks & Production War Stories", "topic": "Lightning Talks & Production War Stories", "type": "Lightning Talk", "video_id": "z7Q5mctqTRU", "recording_link": "https://www.youtube.com/watch?v=z7Q5mctqTRU", "company": "N/A", "speaker": "Shubham Singhal", "word_count": 690, "has_transcript": true, "premise": "View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Shubham Singhal (N/A) outlines the production architecture and failure mitigations:\nI'm a production engineer at Meta Storage Organization. Okay, it all started with a good old fashioned production incident. There was no production impact because it's only in test environment. But during the incident review, we hinged like hey, what if this could have happened in our production environment.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "1O9_7JZeGFw", "title": "Lightning Talk - Goodput, Not Uptime: Rewriting the Four...", "category": "Lightning Talks & Production War Stories", "topic": "Lightning Talks & Production War Stories", "type": "Lightning Talk", "video_id": "1O9_7JZeGFw", "recording_link": "https://www.youtube.com/watch?v=1O9_7JZeGFw", "company": "Anyscale", "speaker": "Yash Shanker Srivastava", "word_count": 571, "has_transcript": true, "premise": "View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Yash Shanker Srivastava (Anyscale) outlines the production architecture and failure mitigations:\nI work for any scale as a software engineer and today we are going to talk about good put and how we are going to remodel the four golden metrics in the GPU era. So we have all known the four latency, traffic error and saturation all of our lives and measured these to measure the reliability of any system. Latency now splits into two numbers with two different SLOs. And latency, yeah, there are two parts.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "14GsuIqpbz8", "title": "Lightning Talk - Hope is Not a Strategy", "category": "Lightning Talks & Production War Stories", "topic": "Lightning Talks & Production War Stories", "type": "Lightning Talk", "video_id": "14GsuIqpbz8", "recording_link": "https://www.youtube.com/watch?v=14GsuIqpbz8", "company": "N/A", "speaker": "Jennifer Petoff", "word_count": 698, "has_transcript": true, "premise": "View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Jennifer Petoff (N/A) outlines the production architecture and failure mitigations:\nAnd as someone who firmly believes that you can SRE anything, I quickly realized that folding a paper garden is fundamentally a complex systems problem requiring architecture, pipelines, and resilience. In systems design, complex and brittle architectures, they fail catastrophically under stress. V3 scaled throughput by batch cutting many pages at a time.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "7gjoasFR6ZM", "title": "Lightning Talk - Learn You a Solver for Great Good", "category": "Lightning Talks & Production War Stories", "topic": "Lightning Talks & Production War Stories", "type": "Lightning Talk", "video_id": "7gjoasFR6ZM", "recording_link": "https://www.youtube.com/watch?v=7gjoasFR6ZM", "company": "N/A", "speaker": "Andrew Medworth", "word_count": 742, "has_transcript": true, "premise": "View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Andrew Medworth (N/A) outlines the production architecture and failure mitigations:\nSo, OR-Tools is a is a suite of solvers for combinatorial optimization problems by Google. So, what is a combinatorial optimization problem. So, a good example of a combinatorial optimization problem is a Sudoku puzzle. There There should be exactly one assignment of the free variables which satisfies the constraint and finding it is the whole problem.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "3idHPcS36GY", "title": "Lightning Talk - Singing Coffee Pot", "category": "Lightning Talks & Production War Stories", "topic": "Lightning Talks & Production War Stories", "type": "Lightning Talk", "video_id": "3idHPcS36GY", "recording_link": "https://www.youtube.com/watch?v=3idHPcS36GY", "company": "N/A", "speaker": "Corey Quinn", "word_count": 793, "has_transcript": true, "premise": "View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Corey Quinn (N/A) outlines the production architecture and failure mitigations:\nIn the office, I have a problem where the people that I work with often take the last cup of coffee and don't wind up making more, as one does. &gt;&gt; [music] &gt;&gt; Because I make my problems everyone's. The problem, of course, is that unplugging it requires two approvals and a pull request because the future is stupid. Because otherwise, there's going to be a significant significant problem.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "HOTD0T1inus", "title": "Lightning Talk - Why Your Kubernetes Autoscaler Fails LLM...", "category": "Lightning Talks & Production War Stories", "topic": "Lightning Talks & Production War Stories", "type": "Lightning Talk", "video_id": "HOTD0T1inus", "recording_link": "https://www.youtube.com/watch?v=HOTD0T1inus", "company": "N/A", "speaker": "Shreyansh Sancheti", "word_count": 594, "has_transcript": true, "premise": "View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Shreyansh Sancheti (N/A) outlines the production architecture and failure mitigations:\nUm what we will focus on is CPU auto scalers that watch over only the auto scaler part and not the Q depth and KV pressure. We expose uh vLLM engine metrics uh that goes through Prometheus and sets directly to the HPA, so that takes care of your auto scaling part. So, I had to do this, scale against the SLO.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "mNOVtFFONcw", "title": "Precision Over Proliferation: SRE Approach for Leaner, Smarter and Data-Driven..", "category": "Observability, Telemetry & OpenTelemetry", "topic": "Observability, Telemetry & OpenTelemetry", "type": "Breakout", "video_id": "mNOVtFFONcw", "recording_link": "https://www.youtube.com/watch?v=mNOVtFFONcw", "company": "Rubriks", "speaker": "Md Shaghil", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/shaghil", "conference": "SREcon26 Americas", "premise": "Tame Your Metrics Monster: Cut Observability Costs by 40% Without Sacrificing Reliability", "technical_depth": "Md Shaghil (Rubriks) explores production systems architecture and reliability mechanisms:\n\nObservability costs eating 30% of your infrastructure budget? You're not alone. Learn battle-tested strategies that deliver 40%+ cost savings while maintaining full visibility.\n\nDiscover how we tackled exploding metrics cardinality using three game-changing approaches:\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 268, "has_transcript": true}, {"session_id": "LTYBh4kRtgc", "title": "Reliable OpenTelemetry at Scale: No Queue, No Problem", "category": "Observability, Telemetry & OpenTelemetry", "topic": "Observability, Telemetry & OpenTelemetry", "type": "Breakout", "video_id": "LTYBh4kRtgc", "recording_link": "https://www.youtube.com/watch?v=LTYBh4kRtgc", "company": "ClickHouse", "speaker": "Tommy Li and Vlad Seliverstov", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/li", "conference": "SREcon26 Americas", "premise": "Operating the OpenTelemetry Collector across massive distributed environments with millions of spans and metrics per second is notoriously vulnerable to memory exhaustion. Standard collector pipelines rely heavily on in-memory batching queues, which balloon under downstream latency spikes and cause the collector to OOM crash, dropping telemetry precisely when an outage occurs.", "technical_depth": "Tommy Li and Vlad Seliverstov (ClickHouse) present an alternative, high-resilience streaming architecture for OpenTelemetry:\n1. The Memory Ballooning Vulnerability: Analyzing how downstream database backpressure or network blips cause in-memory collector queues to expand uncontrollably, leading to OOM kills and cascading data loss.\n2. The 'No Queue' Streaming Pipeline: Eliminating unbounded internal collector buffers in favor of bounded, zero-copy streaming pipelines that immediately propagate backpressure directly to upstream clients.\n3. Synchronous Pushback & Upstream Throttling: Forcing client SDKs and edge agents to buffer or drop low-priority telemetry locally rather than allowing central collectors to crash under load.\n4. ClickHouse Direct Ingestion: Optimizing OTel batch writes directly into ClickHouse column-oriented storage, maximizing compression and reducing CPU serialization overhead.", "takeaways": "\u2022 **In-Memory Queues Are Time Bombs:** In-memory collector buffers will always exhaust memory when downstream storage degrades; bound queues strictly.\n\u2022 **Propagate Backpressure to the Edge:** Collectors must return HTTP 429 / gRPC ResourceExhausted immediately so client SDKs can throttle gracefully.\n\u2022 **Prioritize Ingestion Availability Over Completeness:** In extreme outages, downsample non-essential traces to ensure critical error logs and Golden Signals survive.\n\u2022 **Leverage Columnar Storage:** Direct column-oriented ingestion allows ingesting millions of telemetry events per second with minimal CPU overhead.", "word_count": 218, "has_transcript": true}, {"session_id": "qUvom_WiKc4", "title": "Unlock High-Frequency Deployments without Blowing Up Prometheus", "category": "Observability, Telemetry & OpenTelemetry", "topic": "Observability, Telemetry & OpenTelemetry", "type": "Breakout", "video_id": "qUvom_WiKc4", "recording_link": "https://www.youtube.com/watch?v=qUvom_WiKc4", "company": "Reddit", "speaker": "Ganesh Vernekar", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/vernekar", "conference": "SREcon26 Americas", "premise": "High-frequency deployments often create a hidden bottleneck in Kubernetes: time-series churn. As pods come and go, Prometheus accumulates \"stale\" series in memory, leading to dangerous spikes and OOM crashes.", "technical_depth": "Ganesh Vernekar (Reddit) explores production systems architecture and reliability mechanisms:\n\nThis talk introduces\n\nstale-series compaction\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 154, "has_transcript": true}, {"session_id": "KJXRVefOUcw", "title": "From Cost Center to Data Plane: Big League Observability...", "category": "Observability, Telemetry & OpenTelemetry", "topic": "Observability, Telemetry & OpenTelemetry", "type": "Breakout", "video_id": "KJXRVefOUcw", "recording_link": "https://www.youtube.com/watch?v=KJXRVefOUcw", "company": "Proscia", "speaker": "Kyriakos Toulgaridis and Jeff Rhude", "word_count": 2538, "has_transcript": true, "premise": "Most organizations treat observability as a vendor cost that only grows, and quietly instrument less to keep it in check. This talk is a field report from a regulated healthcare imaging platform that took the opposite path, reframing observability as a data problem and building an open-source telemetry platform that costs 30% less than the prior vendor while retaining thousands of times more data indefinitely. More importantly, it explores what that reframing unlocked once cost was no longer a constraint: a convergence where engineering, product, and business teams began asking questions of the same data. Attendees will leave with a reference architecture, a grounded buy-versus-build checklist, and a new way of thinking about what their telemetry pipeline is really for. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Kyriakos Toulgaridis and Jeff Rhude (Proscia) outlines the production architecture and failure mitigations:\nDigitizing slides unlocks faster, better diagnostics, remote collaboration, and scale with AI and we bring therapies to market sooner. To control costs, we turned services off and even rotated telemetry across customers, turning it off for healthy ones to spotlight the ones having problems. Open telemetry agents and collectors are simple simpler to deploy and manage and ClickHouse handles operational work like automatic compaction itself. After one year in production we're spending about the same monthly as we did before but we're ingesting more and keeping it all.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "E6GC5S11Uy4", "title": "How the Hell Do We Pay for All This? The Bill Inside the Bill", "category": "Observability, Telemetry & OpenTelemetry", "topic": "Observability, Telemetry & OpenTelemetry", "type": "Breakout", "video_id": "E6GC5S11Uy4", "recording_link": "https://www.youtube.com/watch?v=E6GC5S11Uy4", "company": "Duckbill", "speaker": "Corey Quinn", "word_count": 8054, "has_transcript": true, "premise": "AI economics look simple until you start digging. A simple \"cost per token\" hides inference infrastructure, capacity commitments, cloud charges, and contract terms that shift faster than some sports cars. Come explore the fractal complexity of modern AI economics and the reliability problems dressed up as a procurement vehicle. We'll point to the tools we all know and tolerate (SLOs, observability, error budgets, screaming at people) at cost and vendor volatility. Let's see what happens! View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Corey Quinn (Duckbill) outlines the production architecture and failure mitigations:\nI have identified the solution to your AI spending problem. The technology, sure, that's still in development, but our payment infrastructure, that shit's production grade. In hindsight, that will be considered part of the problem in the history books. The problem is is after the demo's done, what's going to keep the gates open here.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "lldir_gn44s", "title": "It's About Time: A Blueprint for Operating Resilient and...", "category": "Observability, Telemetry & OpenTelemetry", "topic": "Observability, Telemetry & OpenTelemetry", "type": "Breakout", "video_id": "lldir_gn44s", "recording_link": "https://www.youtube.com/watch?v=lldir_gn44s", "company": "Open Systems AG", "speaker": "Raphael Seebacher", "word_count": 5075, "has_transcript": true, "premise": "NTP is your classic invisible infrastructure - until a silent failure takes down your consensus or security protocols. This talk unpacks the mechanics of time synchronization, from hardware oscillator drift to the global scale of 10,000+ nodes. Drawing on production experience at Open Systems, this session presents an architectural blueprint for building a resilient, scalable, and authenticated NTP-based time dissemination service. We explore the full operational lifecycle: from selecting reliable reference clocks to managing fleet-wide availability, robust observability, and the deployment of Network Time Security (NTS) - ensuring your fleet remains synchronized and secure as we approach the looming 2038 epochalypse. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Raphael Seebacher (Open Systems AG) outlines the production architecture and failure mitigations:\nAnd we've all seen this one here before and that little brittle thing at the bottom, I would argue in some cases, probably in too many cases, the problem is actually unauthenticated time on 1 2 3 UDP from somewhere in the internet and I would say that's a problem. Then we look at what it in practice looks like, the architecture, then a bit of operational war stories, a bit of security, and then we look into the glorious future and what will go wrong there, or not. So we want to kind of atomic the and the problem is well the earth as us humans it's not perfect so the rotation is not like constant so the UT1 and the UTC they drift apart. That's what basically a clock is and the thing we all know is Unix time t so first of January 1970 plus the seconds since then gives us current time in its legacy form 32-bit plus a couple of others and the problem here of course is this is a finite data type so at some point all the bits are one then it rolls over problem we get to that in a bit.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "SZiSATibAgw", "title": "Operating the Unobservable: Building Observability for...", "category": "Observability, Telemetry & OpenTelemetry", "topic": "Observability, Telemetry & OpenTelemetry", "type": "Breakout", "video_id": "SZiSATibAgw", "recording_link": "https://www.youtube.com/watch?v=SZiSATibAgw", "company": "Sixt SE", "speaker": "Maren Afflerbach", "word_count": 4282, "has_transcript": true, "premise": "Nobody wants to touch this system - but everyone depends on it. We operate a 25-year-old enterprise monolith, PHP and COBOL sharing database connections, over 200 modules, 10,000+ tables, and zero modern observability. The developers who understood it are gone, and documentation is practically nonexistent. To safely decompose this monolith, we needed to understand what it actually does. So we built our own observability stack from scratch: SQL fingerprinting at the driver level, cross-language stack trace enrichment, static analysis with custom parsers for COBOL embedded SQL and PHP dynamic dispatch, and runtime ownership mapping. And eventually implementing OpenTelemetry by hand for languages no official SDK supports. What we found was more than uncomfortable, and changed our entire decomposition strategy. This is a practitioner field report, with hard-won lessons from operating a system that was never designed to be observed. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Maren Afflerbach (Sixt SE) outlines the production architecture and failure mitigations:\nUm so the first problem is not really that um the first problem is not that the code is very old. The first problem is that this um the system still matters while our knowledge about over the years just became incomplete. An architecture diagram tells us usually what somebody believes how it's built but and I'm a believer that the current architecture is somewhere between a lasagne and a spaghetti bolognese with carbonara or something like that uh and the spaghetti the flying spaghetti monster would be maybe very proud of us. The problem and the hard part is really to recovering the operational context um which is just accumulate over the decades in my case at least.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "zYC8iA7x3X4", "title": "What My Dad's Allotment Taught Me About Observability", "category": "Observability, Telemetry & OpenTelemetry", "topic": "Observability, Telemetry & OpenTelemetry", "type": "Breakout", "video_id": "zYC8iA7x3X4", "recording_link": "https://www.youtube.com/watch?v=zYC8iA7x3X4", "company": "N/A", "speaker": "Callum Donald", "word_count": 4342, "has_transcript": true, "premise": "Building a weather station for my dad's allotment forced me to think differently about observability. With limited compute, finite network bandwidth and a capped data allowance, every metric carried a real cost. For the first time, I had to decide not just what could be observed, but what was genuinely worth observing. The same question emerged at work. Instrumentation that made sense across hundreds of instances became difficult to justify at tens of thousands. Rather than remove visibility, we introduced a routing model that classifies telemetry by value and routes it to the right destination: long-term storage for critical signals, ephemeral pipelines for operational awareness, and local retention for deep diagnostics. This session shares the architecture, trade-offs and lessons from a tiered observability platform. You'll learn how to reduce telemetry costs, preserve diagnostic depth and make better decisions about what data is worth capturing when observability is no longer free. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Callum Donald (N/A) outlines the production architecture and failure mitigations:\nIt really was the first time that each metric observation and each export had a cost that that mattered to me. We'll come back to it at the end because I think that this resource constraint is something that we're all facing or will all face but our own industrial scale. The size of the weather station makes these scaling challenges very obvious but I think if we look at our industry as a whole, it's very unlikely that we're going to be producing less telemetry data moving forward and chances are that we'll be producing more at scale faster than than we have been to this point and the reasons are up there to see. All of those services need to be observed Where before you would need to force an engineer not to write another log line or to explain how the hotel metrics SDK works.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "css_yuiskrY", "title": "You Probably Don't Need (All of) OpenTelemetry", "category": "Observability, Telemetry & OpenTelemetry", "topic": "Observability, Telemetry & OpenTelemetry", "type": "Breakout", "video_id": "css_yuiskrY", "recording_link": "https://www.youtube.com/watch?v=css_yuiskrY", "company": "N/A", "speaker": "Colin Douch", "word_count": 2045, "has_transcript": true, "premise": "OpenTelemetry wants to own your metrics, your logs, and your entire telemetry pipeline. And because it's become the default answer, a lot of teams are adopting it wholesale without asking whether that complexity is actually buying them anything. It isn't. In this talk, I will make the argument that despite the wide industry push, Prometheus text exposition and structured JSON will serve the vast majority of teams better than OTel metrics and logs. To do that I will trace where OTel actually came from, why its architecture is shaped the way it is, and why metrics and logs were added to a project that was originally just about tracing. I will also cover what the existing standards have been doing in the meantime, and why the ecosystem has continued to evolve without needing OTel to own everything. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Colin Douch (N/A) outlines the production architecture and failure mitigations:\nLike we took OpenCensus, we took OpenTracing, we smashed them together and that gave us a tracing spec, uh some murmurings of a metric spec out of the OpenCensus remnants, but from the beginning OpenTelemetry declared its intention to take over all of your telemetry, right. We got a more fleshed out metric spec, we got a log spec, we got a lot of pushing from the industry over the years, and now if you want to instrument your application, all you need to do is reach for an OTel SDK and it will all be fine, except should we. We got rid of Jaeger, so you have to use OTel, but I think tracing is being used as the thin end of the wedge to nab the rest of your telemetry, and for metrics, for logs, there are better options out there. Like before OTel in metrics, we had Prometheus.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "3CoZs50uedI", "title": "From Thundering Herd to Zero Outages: Building Reliable Inventory Sync", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "3CoZs50uedI", "recording_link": "https://www.youtube.com/watch?v=3CoZs50uedI", "company": "Broadcom Inc", "speaker": "Rushikesh Ghatpande", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/ghatpande", "conference": "SREcon26 Americas", "premise": "Managing accurate inventory across distributed infrastructure is critical for security policy enforcement and operational reliability. Enterprise datacenter software requires centralized policy management across thousands of servers and hundreds of thousands of VMs and containers, yet resources are distributed across multiple data centers.", "technical_depth": "Rushikesh Ghatpande (Broadcom Inc) explores production systems architecture and reliability mechanisms:\n\nThis talk shares a battle-tested inventory synchronization protocol that evolved over 6 years of production experience, handling real-world challenges from thundering herd problems during full datacenter restarts to fairness in queue processing. The protocol uses a 5-stage finite state machine to ensure reliable, consistent inventory sync while preventing system overload.\n\nYou'll learn how we evolved from a naive 3-step process to a robust 5-stage\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 279, "has_transcript": true}, {"session_id": "aNNICz8KUXs", "title": "How We Built Protosockets to Go Beyond HTTP and gRPC", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "aNNICz8KUXs", "recording_link": "https://www.youtube.com/watch?v=aNNICz8KUXs", "company": "Figma", "speaker": "Pratik Agarwal", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/agarwal", "conference": "SREcon26 Americas", "premise": "Collaborative real-time design software like Figma demands continuous sub-10ms synchronization across thousands of multiplayer clients and server clusters. Standard protocols like HTTP/2 and gRPC introduce excessive framing overhead, head-of-line blocking, and CPU serialization costs at hyper-scale, forcing engineers to design a custom socket protocol.", "technical_depth": "Pratik Agarwal (Figma) describes the engineering journey of building 'Protosockets':\n1. Limitations of Existing RPCs: Evaluating gRPC and WebSockets under extreme multiplayer payload churn, where protocol header parsing and stream multiplexing consume significant server CPU.\n2. Protosocket Protocol Design: Creating a binary, stream-based protocol built directly over raw TCP and TLS, integrating Protocol Buffers directly at the wire framing layer.\n3. Kernel Zero-Copy & Memory Efficiency: Utilizing userland zero-copy ring buffers and custom socket allocators to eliminate GC pressure and buffer allocations during high-frequency message broadcasting.\n4. Production Rollout & Reliability: Executing a shadow-traffic migration from WebSockets to Protosockets, validating zero packet loss and achieving a 40% reduction in server CPU utilization.", "takeaways": "\u2022 **Standard Protocols Have Scale Limits:** At extreme scale and real-time multiplayer constraints, generic protocol overhead becomes a primary infrastructure cost.\n\u2022 **Integrate Serialization with Framing:** Parsing protobufs directly from wire buffers avoids intermediate string copying and dramatically lowers memory allocations.\n\u2022 **Shadow Real User Traffic:** Test custom network protocols under live production shadow traffic to catch edge-case connection terminations and middlebox anomalies.\n\u2022 **Design for Graceful Fallback:** Always allow clients to fall back to standard WebSockets or HTTP/2 if corporate firewalls block custom wire protocols.", "word_count": 151, "has_transcript": true}, {"session_id": "mRp6f55BLr4", "title": "Intelligent Load Balancing in Kubernetes", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "mRp6f55BLr4", "recording_link": "https://www.youtube.com/watch?v=mRp6f55BLr4", "company": "Databricks", "speaker": "Gaurav Nanda and Vincent Cheng", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/nanda", "conference": "SREcon26 Americas", "premise": "Kubernetes relies on kube-proxy and DNS for simple Layer 4 load balancing, which works for short-lived HTTP traffic but fails for persistent connections and high-throughput gRPC workloads. With thousands of requests multiplexed over a single TCP connection, clusters often see uneven load, pod hot-spotting, and rising tail latency.", "technical_depth": "Gaurav Nanda and Vincent Cheng (Databricks) explores production systems architecture and reliability mechanisms:\n\nThis talk presents a client-side, control-plane-driven approach that removes kube-proxy and DNS from the data path. A lightweight control plane tracks Service and EndpointSlice updates, while client libraries receive live endpoint changes through xDS and make per-request routing decisions at Layer 7. We show how strategies like Power of Two Choices and zone-affinity routing improve load balance, stabilize tail latency, and reduce resource waste in production.\n\nSREs and platform engineers will learn why default Kubernetes routing breaks down, how to design intelligent client-side load balancing, and what operational challenges emerge when deploying these systems at scale.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 195, "has_transcript": true}, {"session_id": "BIPiWnyzi60", "title": "It's Not Always the Network (But Here's How to Prove It): Kubernetes Packet Capture for SREs", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "BIPiWnyzi60", "recording_link": "https://www.youtube.com/watch?v=BIPiWnyzi60", "company": "Mercari", "speaker": "Mitsuhiro Shibuya", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/shibuya", "conference": "SREcon26 Americas", "premise": "When distributed microservices experience intermittent latency spikes or dropped requests in cloud Kubernetes clusters, software engineers reflexively blame 'the network.' Without empirical packet-level telemetry, SREs spend days engaged in inter-team finger-pointing without definitive proof of where packets are delayed or dropped.", "technical_depth": "Mitsuhiro Shibuya (Mercari) details an automated, low-overhead Kubernetes packet capture framework:\n1. Challenges of Cloud Packet Inspection: Why running `tcpdump` manually inside container pods is dangerous, permission-restricted, and disrupts production workloads.\n2. Ephemeral Debug Containers & eBPF Capture: Utilizing Kubernetes ephemeral containers and eBPF socket filters (kprobes/tracepoints on `dev_queue_xmit` and `netif_receive_skb`) to capture packets non-intrusively.\n3. Automated Pcap Ingestion & Analysis: Streaming captured pcap streams directly to secure cloud storage and parsing TCP handshake latencies, retransmissions, and window resets automatically.\n4. Proving Network vs. App Latency: Calculating Delta T between packet ingress at the network interface card (NIC) and socket read by the application runtime to mathematically prove whether delays stem from network hops or internal application garbage collection.", "takeaways": "\u2022 **Never Run Manual Tcpdump in Production:** Use ephemeral debug containers and eBPF filters to capture traffic without modifying pod manifests or installing utilities.\n\u2022 **Measure NIC-to-Socket Latency:** The difference between packet arrival at the kernel interface and application read reveals whether the issue is network latency or application thread starvation.\n\u2022 **Automate Retransmission Tracking:** High TCP retransmission rates pinpoint bad physical cables or switch buffer exhaustion before application errors surface.\n\u2022 **Democratize Packet Capture:** Build self-service packet capture CLI tools so developers can investigate their own microservice communication paths.", "word_count": 226, "has_transcript": true}, {"session_id": "5z3NJGVj0AE", "title": "Keeping a Hypervisor Fleet Up to Date with Minimal Customer Disruption", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "5z3NJGVj0AE", "recording_link": "https://www.youtube.com/watch?v=5z3NJGVj0AE", "company": "Akamai", "speaker": "Atalay Kutlay", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/kutlay", "conference": "SREcon26 Americas", "premise": "Maintaining a large hypervisor fleet at a cloud provider requires prioritizing critical infrastructure updates while limiting customer disruption. Software updates often require hypervisor restarts, triggering potentially disruptive migrations of guest VMs. Planning maintenance is complex for SREs, who must balance customer disruption, datacenter capacity, and timely completion of updates. Traditional batch-based rollout strategies often fail to account for workload distribution, leading to uneven impact and significant manual intervention.", "technical_depth": "Atalay Kutlay (Akamai) explores production systems architecture and reliability mechanisms:\n\nThis talk presents a production system that uses optimization-based scheduling to plan VM migrations and host updates together. The model decides when each action should occur, ensuring that only a limited number of hosts are updated at once and no customer experiences excessive simultaneous VM migrations, while completing fleet-wide updates efficiently. The resulting schedule is reviewed by SREs and executed automatically by the control plane, reducing manual planning efforts and increasing efficiency.\n\nAtalay Kutlay is a Senior Software Engineer at Akamai. He likes to work on developing solutions to mathematical optimization problems, including virtual machine placement, scheduling, and capacity planning.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 168, "has_transcript": true}, {"session_id": "cIxtPQwWdkg", "title": "Observability for LLMs: Understanding What\u2019s Happening Under the Hood", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "cIxtPQwWdkg", "recording_link": "https://www.youtube.com/watch?v=cIxtPQwWdkg", "company": "TikTok", "speaker": "Salman Munaf", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/munaf", "conference": "SREcon26 Americas", "premise": "As LLMs and AI systems move into the core of modern products, keeping them reliable requires a new way of thinking. Monitoring large language models is fundamentally different from monitoring traditional web services. Latency and error rates alone no longer tell the full story.", "technical_depth": "Salman Munaf (TikTok) explores production systems architecture and reliability mechanisms:\n\nThis talk explores how observability changes when systems are driven by LLMs and GPU inference rather than REST APIs and CPU workloads. It breaks down the unique behaviors of these systems, including unpredictable model outputs, long context chains, token drift, embedding stores, and GPU bound execution.\n\nUsing real world examples, the session shows which signals actually matter, from token throughput and model latency to GPU utilization, memory pressure, and energy efficiency. Attendees will leave with a clear mental model for understanding LLM system health and a new perspective on reliability when your most critical component is a model that learns, drifts, and scales very differently from code.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 215, "has_transcript": true}, {"session_id": "jKLG4Jh7eRY", "title": "The Gashlycrumb Tinies of AI Networking Yo
