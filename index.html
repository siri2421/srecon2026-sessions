u Must Know (or Languish!)", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "jKLG4Jh7eRY", "recording_link": "https://www.youtube.com/watch?v=jKLG4Jh7eRY", "company": "Clockwork.io", "speaker": "Lerna Ekmekcioglu", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/ekmekcioglu", "conference": "SREcon26 Americas", "premise": "As the worlds of AI workloads and SRE practices converge, more and more teams are expected to ramp up on a whole new vocabulary. Terms like \"NCCL\", \"PXN\", \"MoE\" and \"queue pairs\" are thrown around, yet these concepts can remain elusive, buried in dense academic papers or scattered vendor documentation.", "technical_depth": "Lerna Ekmekcioglu (Clockwork.io) explores production systems architecture and reliability mechanisms:\n\nInspired by Edward Gorey's whimsical illustrated alphabets, this talk provides a structured, approachable tour through essential AI networking concepts. We'll demystify the specialized terminology and building blocks of AI networking, explaining each concept in clear language with practical context and a touch of darkly playful illustration to help the concepts stick.\n\nLerna is a Senior Solutions Engineer at Clockwork Systems where she helps customers meet their performance goals with software solutions built on Clockwork.io\u2019s foundational research. Prior to this, she was a Senior Solutions Architect serving Global Financial Services customers at AWS for 3 years. Before that, Lerna spent 17 years as an infrastructure engineer in large financial services companies working on authentication systems, distributed caching, and multi region deployments using IaC and CI/CD to name a few. In her spare time, she enjoys hiking, sightseeing and backyard astronomy.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 189, "has_transcript": true}, {"session_id": "FnYtIGYkLRU", "title": "The Unconspicuous Role of Conntrack in Kubernetes Networking", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "FnYtIGYkLRU", "recording_link": "https://www.youtube.com/watch?v=FnYtIGYkLRU", "company": "Cisco", "speaker": "Ricard Bejarano", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/bejarano", "conference": "SREcon26 Americas", "premise": "In high-throughput Kubernetes clusters, mysterious latency spikes, connection timeouts, and DNS resolution failures are frequently blamed on application code or network switches. In reality, the Linux netfilter connection tracking (conntrack) table is often silently dropping packets due to table exhaustion, race conditions in multi-threaded UDP handling, and inefficient SNAT port allocation.", "technical_depth": "Ricard Bejarano (Cisco) dives deep into Linux kernel networking internals and Kubernetes packet flow:\n1. Conntrack Architecture & State Tracking: How the kernel netfilter framework tracks TCP, UDP, and ICMP 5-tuples (`nf_conntrack`), and why high pod density saturates `nf_conntrack_max`.\n2. The Notorious UDP Conntrack Race Condition: Examining how multi-threaded DNS lookups (A and AAAA queries sent concurrently on the same source port) trigger race conditions in conntrack table insertions, resulting in 5-second DNS timeouts.\n3. Kernel Tuning for Modern Kubernetes: Sizing `nf_conntrack_buckets` and `nf_conntrack_max`, tuning TCP connection timeout parameters (`nf_conntrack_tcp_timeout_established`), and configuring `nf_conntrack_tcp_timeout_close_wait`.\n4. Bypassing Netfilter with eBPF: Transitioning from legacy iptables/conntrack routing to eBPF-based service routing (e.g., Cilium or eBPF kube-proxy replacements) to achieve zero-conntrack overhead and O(1) packet dispatch.", "takeaways": "\u2022 **Monitor Conntrack Table Utilization:** Alert when `nf_conntrack_count` approaches 70% of `nf_conntrack_max`; reaching 100% causes immediate silent packet drops.\n\u2022 **Fix DNS Conntrack Races:** Deploy NodeLocal DNSCache or enable `single-request-reopen` in `/etc/resolv.conf` to eliminate the concurrent UDP insert race.\n\u2022 **Tune Kernel Timeouts:** Reduce default TCP close-wait timeouts to rapidly reclaim stale conntrack entries under high connection turnover.\n\u2022 **Migrate to eBPF Data Planes:** Replace iptables-based kube-proxy with eBPF native routing to eliminate conntrack bottlenecks entirely.", "word_count": 182, "has_transcript": true}, {"session_id": "ZS1MxDu-vx0", "title": "Experimenting with Fire: Protecting Production from...", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "ZS1MxDu-vx0", "recording_link": "https://www.youtube.com/watch?v=ZS1MxDu-vx0", "company": "Meta", "speaker": "Shripad J Nadgowda and Canturk Isci", "word_count": 4537, "has_transcript": true, "premise": "At hyperscale, thousands of production experiments may need to exercise live downstream dependencies because staging cannot reproduce the full behavior, latency, and capacity profile of real systems. That realism catches regressions early, but it can also turn an experiment into a production incident with unclear ownership and a wide blast radius. This talk covers the operational safety architecture we built after those failures: dependency-by-dependency isolation decisions, deterministic task pinning for fast attribution, and experiment-local health signals that automatically cut traffic before shared services are harmed. Attendees will see the incidents and tradeoffs behind the design, including false positives, capacity overhead, and the cases where production fidelity is unavoidable. The goal is a practical framework for running high-fidelity pre-rollout testing without letting experiments become the most dangerous part of production. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Shripad J Nadgowda and Canturk Isci (Meta) outlines the production architecture and failure mitigations:\nWe'll talk about experiment experimenting with fire, how we are protecting our production from high velocity changes at scale. Again, I'm Sripad Nargoda, I'm production engineer at Meta and I'll hand it over to John Turk. If you hear us saying PE, we mean production engineering. We start with a bit of the problem statement.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "-BS22X93nyg", "title": "Hacking the Kernel with Go: A Practical Introduction to eBPF", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "-BS22X93nyg", "recording_link": "https://www.youtube.com/watch?v=-BS22X93nyg", "company": "Google Developer Expert", "speaker": "Alexandre Cabral", "word_count": 6135, "has_transcript": true, "premise": "Traditional Linux monitoring relies on userland polling (`/proc`, `ps`, `netstat`, `sysfs`), which imposes massive context-switching overhead and suffers from observation blindness\u2014transient millisecond connection drops, kernel socket buffer drops, and malicious process injections vanish between poll intervals. Writing raw C eBPF programs and loading them via libbpf is notoriously difficult, bug-prone, and challenging to integrate into modern Go-based cloud native microservice stacks.", "technical_depth": "Alexandre Cabral (Google Developer Expert) outlines a production-ready engineering pattern using Cilium's `ebpf-go` library:\n1. BPF CO-RE (Compile Once \u2013 Run Everywhere): Utilizing BTF (BPF Type Format) to compile eBPF C programs once and dynamically relocate struct offsets at load time, ensuring binary compatibility across diverse Linux kernel versions without requiring kernel headers on target production nodes.\n2. Kernel Hooks Selection: Contrasting Kprobes/Kretprobes (unstable kernel function tracing) against Tracepoints (stable ABI trace interfaces) and LSM (Linux Security Module) hooks for runtime defense.\n3. High-Performance BPF Ring Buffers: Eliminating old perf-buffer memory copying by streaming kernel events directly to userland Go routines via zero-copy ring buffers.\n4. Safe Kernel Execution: Navigating the BPF In-Kernel Verifier (ensuring memory safety, terminating loops, and eliminating null pointer dereferences) while managing BPF maps (hash maps, LRU maps) for state synchronization between kernel space and Go applications.", "takeaways": "\u2022 **Prefer Tracepoints Over Kprobes:** Kprobes break without warning when kernel symbols are renamed in minor OS updates; Tracepoints provide stable long-term contracts.\n\u2022 **Adopt BPF Ring Buffers:** Ring buffers dramatically outperform perf buffers by eliminating per-CPU memory waste and guaranteeing ordered event delivery.\n\u2022 **Respect the BPF Verifier:** Always validate pointer bounds before dereferencing in kernel space; the verifier will reject programs with potential out-of-bounds access.\n\u2022 **Keep Kernel Probes Minimal:** Execute only minimal filtering and aggregation in the kernel probe; stream raw identifiers to Go userland for heavy business logic processing.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "KbsnPjxs-DA", "title": "Making Software Debloating Production Ready", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "KbsnPjxs-DA", "recording_link": "https://www.youtube.com/watch?v=KbsnPjxs-DA", "company": "Chalmers University of Technology", "speaker": "Ahmed Ali-Eldin", "word_count": 6462, "has_transcript": true, "premise": "Software bloat refers to unnecessary code, files, or dependencies in software. Bloat degrades performance, increases resource consumption, and introduces security risks. Software bloat is hence not just a technical debt for programmers, but also affects the reliability of deployments. The emergence of large language models (LLMs) has further accelerated this growth, with people deploying vibe-coded components and systems. This talk discusses bloat in ML systems across multiple layers, from ML containers to ML shared libraries, and how to debloat these systems. We will introduce novel tools we have built to measure, analyze, and mitigate bloat in deployments, cutting bloat (and CVEs) by up to 90%. The talk will focus on the practical aspects of debloating, including, the benefits of these tools, how to integrate themin CI/CD pipelines, how to make sure that the debloated software is functionally correct, and how our tools make debloating a cost-effective solution for deployment hardening. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Ahmed Ali-Eldin (Chalmers University of Technology) outlines the production architecture and failure mitigations:\nUm and this this is actually a line of research that we started at the university and now that we are also using when some production systems uh with some startups and it actually grew out of frustration and I guess you will know what the frustration is quite soon. The problem with containers is that they are sometimes everything that is not the container. They they are all this blo uh that people build when they basically deploy the containers and then sR and people in deployment they have to deal with these containers. Uh and the problem is that these can dominate the sizes of the of your deployments very quickly and that would affect the performance of your deployment too.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "LWxB7kdc89k", "title": "Performance Prompts", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "LWxB7kdc89k", "recording_link": "https://www.youtube.com/watch?v=LWxB7kdc89k", "company": "N/A", "speaker": "Brendan Gregg", "word_count": 7217, "has_transcript": true, "premise": "Systems performance engineering is traditionally bounded by human cognitive overhead\u2014deciphering complex multi-dimensional flame graphs, correlating kernel tracepoints, and diagnosing erratic CPU cache thrashing under live production traffic. While generative AI and LLMs have emerged as conversational assistants, applying them blindly to performance diagnostics yields hallucinated kernel flags and catastrophic advice. Systems engineers need a formal, structured methodology to use LLMs as deterministic 'Performance Prompts' alongside empirical eBPF telemetry.", "technical_depth": "Brendan Gregg presents a rigorous operational blueprint for augmenting systems performance analysis with structured AI prompts:\n1. Structured Telemetry Ingestion: Converting raw kernel metrics, eBPF trace dumps, and folded stack traces into normalized, token-efficient key-value schemas before feeding into context windows.\n2. Hypothesis-Driven Prompt Framing: Bounding LLM reasoning by forcing models to generate testable hypotheses with specific verification commands (e.g., 'Check if lock contention on mutex X is elevated via syscount or runqlen') rather than asking for general advice.\n3. Counter-Verification & Sandbox Validation: Establishing closed-loop validation where LLM-suggested sysctl tunings or kernel parameters must be tested against simulated load harnesses before touching production clusters.\n4. Flame Graph Summarization: Utilizing specialized token compression to feed flame graph hot paths into models, identifying non-obvious algorithmic regressions across sprawling multi-language service architectures.", "takeaways": "\u2022 **Never Ask LLMs to Guess:** Feed structured telemetry (counters, latency histograms, folded stacks); models excel at anomaly correlation across telemetry, not psychic root-cause guessing.\n\u2022 **Force Executable Hypotheses:** Require the model to provide the exact command or eBPF one-liner needed to prove or disprove its diagnostic assertion.\n\u2022 **Guard Against Deprecated Flags:** LLMs frequently hallucinate outdated or invalid Linux kernel sysctl parameters; validate flags against kernel version documentation or live `/proc/sys` trees.\n\u2022 **Compress Stack Traces:** Raw stack traces explode context windows; fold identical call trees and filter standard runtime boilerplate before ingestion.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "uM2idF7_JJ0", "title": "The Optimization We Didn't Build", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "uM2idF7_JJ0", "recording_link": "https://www.youtube.com/watch?v=uM2idF7_JJ0", "company": "Shopify", "speaker": "Leila Vayghan", "word_count": 2248, "has_transcript": true, "premise": "Over-engineering can be one of infrastructure\u2019s most expensive habits. This talk tells the story of automating database fleet scaling for flash sales at a large-scale e-commerce platform, and the decision to reject a sophisticated, data-driven design in favor of a simpler fixed-target approach. We\u2019ll walk through the technical tradeoff: a tempting per-shop, per-region scaling model based on historical QPS would have saved at most about $6K/month, while adding long-lived data complexity and operational risk. The simpler design decoupled flash-sale safety from baseline provisioning, reduced manual toil, and unblocked a separate right-sizing initiative that delivered $1.5M-$1.8M in annual infrastructure savings. Attendees will leave with a concrete case study in saying no to complexity, using cost analysis to guide architecture, and recognizing when the best engineering decision is the one you choose not to make. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Leila Vayghan (Shopify) outlines the production architecture and failure mitigations:\nAnd this talk is about a piece of automation that we built for uh database scaling during flash sales, and more importantly about uh a piece we decided not to build. So, last year we were asked to make our auto scaler smarter, and we said no. It comes from a good place, uh but it could be wrong uh and it's expensive in ways that don't show up in the design doc. To give you a sense of scale, during the last year over the Black Friday Cyber Monday weekend which is a like big event for Shopify, especially in North America, our merchants sold $14.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "N-3tWfVe_cs", "title": "What Userland Utilities Won't Tell You: Uncovering Hidden...", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "N-3tWfVe_cs", "recording_link": "https://www.youtube.com/watch?v=N-3tWfVe_cs", "company": "N/A", "speaker": "Aivars Kalv\u0101ns", "word_count": 4781, "has_transcript": true, "premise": "Standard userland utilities like ps, netstat, and top create a false sense of security and observability. Built for simpler times, they are easily blindsided by modern abstractions like containers and capabilities, or outright tricked by argument overwriting and linker hijacking. Furthermore, the \"do one thing and do it well\" philosophy forces engineers to combine fragmented tool outputs on vague criteria, burying critical insights in noise. This talk strips away user-space abstractions to demonstrate how to audit, debug, and verify running workloads by querying raw kernel structures directly inside /proc. This approach is invaluable for uncovering malware, anomalies, or when debugging minimalist containers with no native tooling installed. You will discover the most vital /proc files, what they reveal, and how to link them together through inodes and memory addresses to extract the kernel\u2019s absolute truth. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Aivars Kalv\u0101ns (N/A) outlines the production architecture and failure mitigations:\nAnd also kind of fun fact is that BSD gave up on the process file system and instead they rely on system calls to retrieve the information for kernel from kernel because they found that having all this information exposed as files is tricky and introduces new security issues and race conditions and so on. Actually kernel has this limitation on the command name length and it's 16 characters including the terminating zero so it leaves 15 printable symbols and yeah this systemd resolve D is the perfect example where the name still looks recognizable but it's still truncated. And this is special because in the status file you can find out that this is actually a kernel thread. So kernel exposes its threads as regular processes, except for some irregularities.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "etB8jEZuXPM", "title": "When Partitioning Beats Sharing: Ephemeral MicroVMs for...", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "etB8jEZuXPM", "recording_link": "https://www.youtube.com/watch?v=etB8jEZuXPM", "company": "Booking.com", "speaker": "Emir Beganovi\u0107 and Luka Stout", "word_count": 6255, "has_transcript": true, "premise": "Your CI hosts show plenty of idle CPU, yet a job you gave 4 cores behaves like it has 2. Where did they go? At Booking.com we hit exactly this running ~10 million CI jobs a month on a container-based fleet. The bottleneck wasn't hardware but rather a combination of CFS throttling on high thread-count servers. This talk walks through what we did instead: replacing shared-kernel containers with fully isolated ephemeral KVM microVMs on the same hardware. This bought us ~3\u00d7 more effective CI capacity, better p95 latency, and a hard isolation boundary, while preserving exact developer experience with zero CI syntax changes for users. Using four laws as a guide: Little's Law, Amdahl's, Universal Scalability, and Hyrum's, you'll leave with a concrete way to tell when a shared scheduler has stopped fitting your workload, and why partitioning can beat sharing for CI workloads. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Emir Beganovi\u0107 and Luka Stout (Booking.com) outlines the production architecture and failure mitigations:\nYeah, so our talk is ephemeral micro VMs for CI at scale and partitioning meet sharing. But then when we started actually deploying this into production, the CI jobs got faster. So to see why this happens, uh we want to take a look at what 4 CPU really means in the Linux kernel itself. So the kernel just does what it's supposed to do, and it stops all the 16 threads of doing any meaningful work for the other 75 milliseconds.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "0DfZl8wPEsI", "title": "Wide Then Deep Debugging with APerf", "category": "eBPF, Kernel & Systems Performance", "topic": "eBPF, Kernel & Systems Performance", "type": "Breakout", "video_id": "0DfZl8wPEsI", "recording_link": "https://www.youtube.com/watch?v=0DfZl8wPEsI", "company": "AWS", "speaker": "Arthur Petitpierre", "word_count": 2827, "has_transcript": true, "premise": "Diagnosing production performance regressions across modern cloud architectures (such as AWS Graviton and EC2 microVM fleets) is severely hampered by the 'micro-benchmark trap': reproducing an issue in a synthetic test bench misses the distributed real-world interactions, while running heavy profilers like `perf record` fleet-wide imposes unacceptable CPU overhead and generates hundreds of gigabytes of unmanageable trace dumps.", "technical_depth": "Arthur Petitpierre (AWS) introduces APerf, an open-source performance profiling methodology and tool designed for low-overhead production investigation:\n1. The 'Wide Then Deep' Two-Phase Model: Phase 1 (Wide) runs ultra-lightweight sampling (< 0.5% CPU overhead) continuously across hundreds of instances, capturing coarse system metrics, context switches, interrupt rates, and IPC (Instructions Per Cycle). Phase 2 (Deep) triggers surgical eBPF stack traces and PMU hardware counters only on the specific instances or vCPUs exhibiting latency variance.\n2. Non-Intrusive Hardware Performance Counters (PMU): Monitoring topdown microarchitecture metrics (retiring, frontend bound, bad speculation, backend bound) to isolate whether slow requests stem from memory bus stalls, L3 cache misses, or branch mispredictions.\n3. Automated Baseline Diffing: Automatically contrasting the telemetry signatures of slow canary nodes against healthy fleet baselines to highlight aberrant system calls or lock contention without manual guessing.\n4. MicroVM & Container Awareness: Normalizing metrics across cgroups to distinguish between host-level resource contention and container-level CPU throttle throttling.", "takeaways": "\u2022 **Never Profile Deep Fleet-Wide:** Heavy sampling in production risks crashing degraded nodes; use wide continuous telemetry to target surgical deep profiling.\n\u2022 **Hardware Counters Reveal Real Bottlenecks:** High CPU utilization is misleading if 60% of cycles are stalled waiting for DRAM; inspect IPC and memory pipeline metrics.\n\u2022 **Automate Anomaly Baselines:** Human visual inspection of Grafana charts
