ut", "video_id": "pUNLemKo-QE", "recording_link": "https://www.youtube.com/watch?v=pUNLemKo-QE", "company": "Astronomer", "speaker": "Dave O'Connor", "word_count": 5471, "has_transcript": true, "premise": "Production systems shape the people who operate them, in much the same way that buildings and cities shape their inhabitants. We live in our systems. The practices that accumulate around them, the tolerances that develop, the things we stop noticing: all of that is as much a product of design as the systems themselves. We have much to learn from hundreds of years of real-life architecture -- desire paths, trends, old-meaning memes, and the original Vitruvian principles of Durability, Utility and Delight. Hear about some of the key figures in 20th Century architecture, look at some nice buildings, learn about how the principles applied to how these buildings were designed were just as bonkers as the ones we use to build software and systems today, and how you can apply this to your practice. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Dave O'Connor (Astronomer) outlines the production architecture and failure mitigations:\nUm and roughly 30 years ago, which makes me feel very old, I put together a uh portfolio and submitted it to some architecture schools and they said, \"Fabulous. Please go and get the correct exam results in order to study architecture. Um so, I'm going to show you some architecture. It is a bench that was designed uh in 2012 uh and it is a bench that is bad for sitting on, somehow.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "udktz8xq4Gs", "title": "Pull Requests Are Dead, Long Live Peer Review", "category": "Human Factors, SRE Culture & Leadership", "topic": "Human Factors, SRE Culture & Leadership", "type": "Breakout", "video_id": "udktz8xq4Gs", "recording_link": "https://www.youtube.com/watch?v=udktz8xq4Gs", "company": "Overmind", "speaker": "Dylan Ratcliffe", "word_count": 7019, "has_transcript": true, "premise": "I opened a pull request, assigned it to a teammate I respect, and moved on. Eighteen hours later they came back with careful feedback on a loop I had never read. An agent had written it. I didn't care about their comments, because I didn't care about the code. I had wasted the attention of someone whose judgement I value on output I had not bothered to look at. That is when peer review broke for me. A pull request now fuses human decisions with agent extrapolation; and you can't tell which is which. Asking a colleague to review that is asking them to audit a machine, not review a peer. We shifted our human peer review left to the implementation plan, and left PR review to the bots. More people are involved than ever, we understand our code, and we're moving faster. I'll explain how. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Dylan Ratcliffe (Overmind) outlines the production architecture and failure mitigations:\nWe mostly don't read the code that goes to production. Uh and I mean not just the reviewer but even the author very often does not read the code that goes to production. And I was doing the code and shipping stuff to production. Um, but it led to a week where my product manager and I as a twoperson team shipped more code than the entire engineering team combined by every metric, lines of code, pull requests, tickets, scope, everything.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "QQX1Ep_P-5M", "title": "Safe, Empowered, Tired: The Human Side of 24x7 Banking SRE...", "category": "Human Factors, SRE Culture & Leadership", "topic": "Human Factors, SRE Culture & Leadership", "type": "Breakout", "video_id": "QQX1Ep_P-5M", "recording_link": "https://www.youtube.com/watch?v=QQX1Ep_P-5M", "company": "Mauritius Commercial Bank Ltd", "speaker": "Bholanathsingh Surajbali", "word_count": 2153, "has_transcript": true, "premise": "Banking does not sleep. Someone is always on call. An outage not contained quickly becomes a customer-trust problem, not just a technical one. We put AI assistants on the on-call rota, then measured what it did to the engineers not only to MTTR. Six human-factor metrics, beside our SLOs. Three improved: juniors stopped dreading their first solo night. Two got worse, including \"my judgement is trusted\" not a wellbeing problem but a control problem: an engineer who stops saying no to the machine makes human-in-the-loop a fiction we are paying for. One surprised us: triage got lighter, the night did not. We swapped finding an answer for judging one every alert, all night. Evaluator fatigue. Force multiplier or replacement? Wrong question. What do we owe the people who answer at 02:00? We show the operating model, the rubric, and the numbers that do not flatter us. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Bholanathsingh Surajbali (Mauritius Commercial Bank Ltd) outlines the production architecture and failure mitigations:\nAnd by Monday morning, this isn't an availability problem anymore. It's not about like we're going to be using like some technology like Argo or putting some more memory or some more more set of CPU. A third every incident has an audience, a regulator, an audit, and more importantly, our customers, our ever demanding customers. And what is there as a customer or like a board or the press or even like social media these days that we put in impression and that postmortem goes over years, that stays inside like what that incident has taken place.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "nj9-3F_usYs", "title": "The Future of Operations", "category": "Human Factors, SRE Culture & Leadership", "topic": "Human Factors, SRE Culture & Leadership", "type": "Breakout", "video_id": "nj9-3F_usYs", "recording_link": "https://www.youtube.com/watch?v=nj9-3F_usYs", "company": "bitbitmobile", "speaker": "Effie Mouzeli", "word_count": 5795, "has_transcript": true, "premise": "It is three in the morning and the phone is ringing. It is the database. Again. You are cross, and also a tiny bit pleased, because in twenty minutes you will have fixed it, and nobody else could have. So what does this job look like in twenty years? A few guesses. \u2022 We will rent our servers by the hour from a bookshop. \u2022 We will write down what a system should be, and something else will keep it that way. \u2022 We will get much fancier titles. \u2022 When the phone rings, we will paste the error into a chat window, and a stranger will tell us to read the manual. Five predictions, one phone call, and a sysadmin with eighty-three servers, no degree, and a very good memory. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Effie Mouzeli (bitbitmobile) outlines the production architecture and failure mitigations:\nBecause we live in a time where open source is production grade and it's finally it's taking it's taken seriously while more and more people in the world have access to commodity hardware and and the internet. So, by and large, my job is lots of hard work, interesting problems, and very very few fires every now and then. From time to time, my phone buzzes in the middle of night with multiple SMSs saying, \"Problem alert. Memory, CPU, load averages, database queries per second, one machine, one page, it's brilliant.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "XvbfU6feF-g", "title": "Tribute to Philip Rowlands", "category": "Human Factors, SRE Culture & Leadership", "topic": "Human Factors, SRE Culture & Leadership", "type": "Breakout", "video_id": "XvbfU6feF-g", "recording_link": "https://www.youtube.com/watch?v=XvbfU6feF-g", "company": "N/A", "speaker": "Niall Murphy", "word_count": 1491, "has_transcript": true, "premise": "In this session, Niall Murphy (N/A) investigates the operational realities and reliability failure modes encountered when scaling production services. The presentation details practical engineering techniques to improve system resilience and observability across the Human Factors, SRE Culture & Leadership domain.", "technical_depth": "Niall Murphy (N/A) outlines the production architecture and failure mitigations:\nBut I also wanted to thank Jane Street since they made a very generous donation to Usenix in Phil's memory and this marks one of those increasingly frequent occasions when hedge funds are doing the right thing morally. But as well as helping to demonstrate that Google could in fact extrude its production authority across the globe, which is no easy matter, Phil, in the words of Claire Stapleton, another writer about Google, thought infrastructure was an art. For example, he designed the first production deployment of NTP for Google. And when the famous leap second incident of late 2005 happened, which messed Google storage up real good, he led the response to keep 2008 from doing the same thing.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "F6vJkVb0lfY", "title": "Why Can't We Stop Asking \"What Does It Mean to Be SRE\"?", "category": "Human Factors, SRE Culture & Leadership", "topic": "Human Factors, SRE Culture & Leadership", "type": "Breakout", "video_id": "F6vJkVb0lfY", "recording_link": "https://www.youtube.com/watch?v=F6vJkVb0lfY", "company": "Reddit", "speaker": "Laura de Vesine", "word_count": 7170, "has_transcript": true, "premise": "Who are we? What is this job that we do? How do we define ourselves as engineers and as SREs? I've never been to an SREcon that doesn't have talks asking some version of this question. Why do we keep returning to it? Why is it so important to us? Obviously there's no one right answer to such a question, but one answer lies in the \"Viable Systems Model\". This talk is about what that model is, and how we as SREs and SRE teams both form viable systems ourselves and act as important components in the systems we interact with. Along the way I hope to give some ways to lean into the model to better \"manage up\" in our orgs, and to give some hints to why AI agents still fall short as SREs. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Laura de Vesine (Reddit) outlines the production architecture and failure mitigations:\nSo if I talk about the behavior of a piece of software, like it can scale up to serve 100 requests per second per pod, I'm still treating it as a as a black box. Similarly, things like errors, how it responds to configuration changes I make, things that I know about its latency, those are all elements of the black box software system. The variety of a software system, especially a modern software system at scale, is incredibly high. So we want to see more cases where the output is a good result, fewer cases of the ones with errors, high latency, bad results.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "yvVWHAyr2HI", "title": "AI Agents for Incident Investigation: The Good, The Bad, and The Ugly", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "yvVWHAyr2HI", "recording_link": "https://www.youtube.com/watch?v=yvVWHAyr2HI", "company": "Vocaly AI", "speaker": "Vladyslav Budichenko", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/budichenko", "conference": "SREcon26 Americas", "premise": "AI agents can help with production incidents, but most demos skip the messy reality. This session covers using LLM-based agents and coding engines like Claude Code during real on-call work. You'll learn how agents can compress investigation time, improve MTTR, and help you understand what broke without drowning in alerts and dashboards. We'll look at what works: pulling context, correlating signals, suggesting fixes. And what doesn't: where agents give bad advice or waste your time.", "technical_depth": "Vladyslav Budichenko (Vocaly AI) explores production systems architecture and reliability mechanisms:\n\nVladyslav Budichenko is a software engineer with 11 years of experience building distributed systems, AI applications, and production infrastructure at scale. An AWS- and GCP-certified professional architect, Vladyslav is also the founder of Vocaly AI, a platform to create voice AI agents for businesses. He is passionate about discovering new AI tools and integrating them into everyday workflows, especially for vibe coding and automations.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 139, "has_transcript": true}, {"session_id": "3l11oLIeCjo", "title": "Beyond Blanket Freezes: Enabling Safe Innovation During Critical Events at Netflix", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "3l11oLIeCjo", "recording_link": "https://www.youtube.com/watch?v=3l11oLIeCjo", "company": "Netflix", "speaker": "Prachi Jain and Sandhya Narayan", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/jain", "conference": "SREcon26 Americas", "premise": "Deployment freezes are a common safety lever during high-risk periods, but they often slow teams down and create bottlenecks. In this talk, Prachi Jain and Sandhya Narayan share how Netflix is replacing blanket freezes with data-driven, service-specific risk management that enables safe, continuous delivery even during critical events. Attendees will learn how to classify services by risk, integrate this into CI/CD, and empower teams to ship quickly without sacrificing reliability.", "technical_depth": "Prachi Jain and Sandhya Narayan (Netflix) explores production systems architecture and reliability mechanisms:\n\nPrachi Jain is an experienced SRE with expertise in building and managing scalable, reliable services in Public Key Infrastructure (PKI), cryptography, secrets management, and security. Currently an SRE at Netflix, she previously held key roles at Fastly and Cisco, where she addressed complex, large-scale reliability challenges for high-availability security applications. An active contributor to the Internet Engineering Task Force (IETF), Prachi actively helps shape security standards and is recognized for her passion for solving intricate technical problems.\n\nSandhya Narayan is an accomplished Technical Program Manager (TPM) with extensive experience in leading and managing global, cross-functional teams to deliver complex security initiatives. She is an expert in information security, compliance, and risk management, with a deep understanding of secure product lifecycles and regulatory requirements. Currently, Sandhya serves as a TPM at Netflix, where she drives critical security programs and fosters cross-team collaboration. Previously, she held strategic roles at Adobe, SAP, eBay, and the Stanford Research Institute, leading key global security initiatives and strengthening security engagement across organizations.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 236, "has_transcript": true}, {"session_id": "XU5YsjXxe-k", "title": "Designing Layered High\u2011Availability Architectures for PostgreSQL on a Budget", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "XU5YsjXxe-k", "recording_link": "https://www.youtube.com/watch?v=XU5YsjXxe-k", "company": "Stormatics Pte Ltd", "speaker": "Umair Shahid", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/shahid", "conference": "SREcon26 Americas", "premise": "This presentation talks about high availability for PostgreSQL by treating it as a layered set of replication and failover patterns. Many teams deploy synchronous replication without understanding its trade\u2011offs or rely on single\u2011region clusters that can\u2019t survive a data\u2011center outage. Worse, budget constraints often force compromises that jeopardise recovery objectives. The talk proposes a framework for composing HA layers - local synchronous replication, asynchronous standbys, hot standbys and cross\u2011region disaster\u2011recovery nodes - to meet specific RPO/RTO targets while controlling costs. It will cover practical experiences from multiple deployments where achieving four-nines availability was critical, yet enterprise clustering licences were not an option.", "technical_depth": "Umair Shahid (Stormatics Pte Ltd) explores production systems architecture and reliability mechanisms:\n\nUmair Shahid is the founder of Stormatics, a PostgreSQL-focused professional services firm that designs, operates, and scales production database platforms for fintechs, SaaS companies, and large enterprises. He works on high availability architectures, performance optimisation, database security, and migrations from expensive proprietary databases to PostgreSQL, both on premises and in the cloud.\n\nUmair is a veteran of the PostgreSQL community. Being a recognized subject matter expert, he is a regular speaker at conferences globally and publishes blogs that get 15,000+ visitors each month.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 185, "has_transcript": true}, {"session_id": "vHDuHBjZr6s", "title": "Epistemology of Incidents and Problem Solving", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "vHDuHBjZr6s", "recording_link": "https://www.youtube.com/watch?v=vHDuHBjZr6s", "company": "Atlassian", "speaker": "Jack Kingsman", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/kingsman", "conference": "SREcon26 Americas", "premise": "In high-pressure incident response, critical fundamentals of thought, action, and communication matter more than ever. Engineers need concrete criteria and examples of how to think and problem-solve during incidents, and answers to big questions: What fundamental decision-making loops should we orient ourselves in when disaster strikes? How do we reason about trapping the location and cause of unknown issues? What specific qualities make a hypothesis good or worthwhile, and how do we construct effective tests to prove or disprove them? How can we structure notes and progress updates to provide the most signal and the least noise in fast-paced situations?", "technical_depth": "Jack Kingsman (Atlassian) explores production systems architecture and reliability mechanisms:\n\nDrawn from nearly a decade of experience in Site Reliability Engineering, from small startup to publicly traded SaaS firm, this talk will level up how you think and act when it matters, and equip you with the concepts to teach those skills to others.\n\nJack Kingsman is a Site Reliability Engineer at Atlassian, EMT, scuba diver, and serial hobbyist. He draws on his unique blend of experiences in infrastructure engineering, incident command, and emergency medical care and instruction to provide practical, battle-tested, people-oriented tools for operations and infrastructure. Jack believes that the most important part of any technical system is the people who build and tend to it, and that excellence in engineering begins with excellence in people, and providing them the tools and methods to rise to that excellence.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 230, "has_transcript": true}, {"session_id": "ddt0qgvTw5k", "title": "Executing Chaos Engineering in Production at a Critical Financial Institution", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "ddt0qgvTw5k", "recording_link": "https://www.youtube.com/watch?v=ddt0qgvTw5k", "company": "Bradesco", "speaker": "Luiz Siqueira and Leonardo Marques", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/siqueira", "conference": "SREcon26 Americas", "premise": "Discover how Chaos Engineering transformed a high-stakes financial ecosystem processing thousands of transactions per second. This real-world case study unveils a reproducible framework for risk-averse organizations, blending fault injection, automation, and observability.", "technical_depth": "Luiz Siqueira and Leonardo Marques (Bradesco) explores production systems architecture and reliability mechanisms:\n\nKey takeaways include safe experiment design with governance guardrails, automated chaos workflows, and multidisciplinary GameDays. Results: 73% reduction in MTTD, 10 hidden vulnerabilities exposed, 5 new metrics, and a shift to proactive reliability.\n\nLearn a compliance-friendly methodology to turn failures into insights, bridging theory and measurable business impact in critical systems. Perfect for SREs, Developers, and Ops teams seeking production-ready resilience.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 205, "has_transcript": true}, {"session_id": "IVHRqKS2JmY", "title": "From Chaos to Confidence: How SREs Can Leverage 50 (and Counting) Failure Scenarios to Test AI Readiness", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "IVHRqKS2JmY", "recording_link": "https://www.youtube.com/watch?v=IVHRqKS2JmY", "company": "IBM Research", "speaker": "Rohan R. Arora and Bhavya", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/arora", "conference": "SREcon26 Americas", "premise": "Using sandboxed Kubernetes environments, we created 50+ production-inspired failure scenarios that put AI assistants to the test across the full SRE toolkit. The results? Current AI models resolve only 13.8% of scenarios\u2014a reality check for anyone evaluating these tools.This session introduces our evaluation framework and shows how you can use it to benchmark AI assistants against real failure patterns, chaos-test your own applications with production-inspired scenarios, and assess whether AI-assisted approaches fit your operational needs.We're building a community-driven repository where SREs contribute real incidents and advance the field together. Come learn what AI can (and can't) do today\u2014and help shape what it could do tomorrow.", "technical_depth": "Rohan R. Arora and Bhavya (IBM Research) explores production systems architecture and reliability mechanisms:\n\nRohan R. Arora is a Senior Software Engineer at IBM Research. He joined IBM Research in 2016 after graduating from the University of Illinois at Urbana-Champaign with a Master's Degree in Electrical and Computer Engineering. In his early career at IBM, he co-led the effort on developing augmented and virtual reality-based solutions for the enterprise. Since 2021, he has been working at the intersection of machine learning (ML) and IT operations, particularly in theareas of incident management and resource optimization.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 185, "has_transcript": true}, {"session_id": "GF6PqeV_l2s", "title": "From ESXi to Kubernetes: Modernizing 1,400 Edge Locations with Open Source", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "GF6PqeV_l2s", "recording_link": "https://www.youtube.com/watch?v=GF6PqeV_l2s", "company": "Systems Engineering", "speaker": "Jasjit Singh and Kanika Nayyar", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/singh-jasjit", "conference": "SREcon26 Americas", "premise": "When virtualization licensing costs increased tenfold, a large retail organization rethought how it ran infrastructure across 1,400 edge locations. This session shares how existing store hardware was transformed from a VMWare-based setup into a fully open-source, Kubernetes-powered platform \u2014 without adding new hardware or disrupting business operations.", "technical_depth": "Jasjit Singh and Kanika Nayyar (Systems Engineering) explores production systems architecture and reliability mechanisms:\n\nLearn how ESXi was replaced with Kubernetes clusters were centrally managed using GitOps with FluxCD, and open-source tools like Dex, Helm, Grafana, and KubeVirt were used to deploy and observe workloads at scale. The talk focuses on practical SRE lessons around automation, resilience at the edge, and cost-efficient modernization that attendees can apply to their own distributed environments.\n\nJasjit Singh is a Technical Program Manager at Loblaw with over 18 years of experience delivering enterprise-scale solutions across large, distributed environments. His expertise spans monitoring, observability, and Site Reliability Engineering, with a strong focus on building resilient and scalable platforms.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 146, "has_transcript": true}, {"session_id": "F1JYRchNmdo", "title": "How Security Incidents Are Different ... and How They're Exactly the Same", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "F1JYRchNmdo", "recording_link": "https://www.youtube.com/watch?v=F1JYRchNmdo", "company": "Reddit, and Alec Randazzo, Datadog", "speaker": "Laura de Vesine", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/de-vesine", "conference": "SREcon26 Americas", "premise": "In most ways, security incidents are extremely similar to the incidents that we regularly manage as SREs: they are emergencies that involve coordinating many responders, have specific expectations for stopping the bleeding, then resolving the issue, and teams are expected to engage in long-term follow ups for preventing recurrences. However, in some key ways they are meaningfully different. This is especially true around requirements to document and not document particular things, primarily because of legal concerns; it\u2019s also often the case that investigation for a security incident requires a much more detailed lens than many reliability incidents. This talk will explore what experts on both sides of security & SRE/reliability incidents can learn from each other, and help SREs build a mental model of how and why the security space is different (and the same).", "technical_depth": "Laura de Vesine (Reddit, and Alec Randazzo, Datadog) explores production systems architecture and reliability mechanisms:\n\nLaura de Vesine is a 25+ year software industry veteran. She has spent the last 10 years in SRE working in incident analysis and prevention, systems understanding, chaos engineering, and the intersection of technology and organizational culture. Laura is currently a staff engineer at Datadog, Inc. She also has a PhD in computer science, but mostly her kittens nap on her diploma.\n\nAlec Randazzo has been in the security detection and response space for 13+ years. He's split this time between incident response consulting, detection and response engineering, and internal detection and response. He's responded to dozens of high severity security incidents at organizations ranging from SMBs to Fortune 500s. Alec is passionate about real world practical detection and response. He is currently a staff security incident response engineer at Datadog.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 266, "has_transcript": true}, {"session_id": "ibJ-MUgJyS0", "title": "How We Debug 1000s of Databases with AI: Lessons from an AI-Assisted Database Debugging Platform", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "ibJ-MUgJyS0", "recording_link": "https://www.youtube.com/watch?v=ibJ-MUgJyS0", "company": "Databricks", "speaker": "Annie Zhou and Sophie Zhang", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/zhou-annie", "conference": "SREcon26 Americas", "premise": "Engineers can now vibe-code with AI, so why aren\u2019t we vibe-debugging yet? At Databricks, we built an AI-assisted debugging system that helps engineers reason about thousands of databases across multiple clouds. It consolidates metrics, logs, and system signals, explains anomalies, and recommends safe next steps \u2013 reducing investigation time by up to 90%.", "technical_depth": "Annie Zhou and Sophie Zhang (Databricks) explores production systems architecture and reliability mechanisms:\n\nIn this talk, we will discuss how to build AI agents that are reliable in production, how to design the platform foundation that makes them safe, and how to drive adoption through fast iteration and user-centered design. Attendees will leave with concrete patterns for reducing incident toil and scaling SRE workflows with AI.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 106, "has_transcript": true}, {"session_id": "Js7TeN4347w", "title": "Human Factors in the Age of AI Ops: Re-Engineering Trust between Humans and Machines", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "Js7TeN4347w", "recording_link": "https://www.youtube.com/watch?v=Js7TeN4347w", "company": "CTC Ops", "speaker": "Eddie Redick", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/redick", "conference": "SREcon26 Americas", "premise": "When everything fails at once... cascading service degradation, overlapping automations, and an over-eager AI auto-remediator - you don\u2019t rise to the level of your architecture; you fall to the level of your systems thinking.", "technical_depth": "Eddie Redick (CTC Ops) explores production systems architecture and reliability mechanisms:\n\nAs AI and automation become deeply woven into the fabric of reliability engineering, teams are learning that convergence isn\u2019t just technical \u2014 it\u2019s cultural, cognitive, and procedural. What happens when human intuition collides with machine logic in the middle of a P1?\n\nI have witnessed countless times where precious outage minutes are wasted chasing false positives. AI is garbage-in/out, or, as I always say, \"Only as smart as you feed it.\"\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 236, "has_transcript": true}, {"session_id": "aYq9a4qUszs", "title": "Mean Time to WTF: Why Developer Experience Frameworks Belong in Your Incident Retrospectives", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "aYq9a4qUszs", "recording_link": "https://www.youtube.com/watch?v=aYq9a4qUszs", "company": "Systems Engineering", "speaker": "Nicole Forsgren", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/forsgren", "conference": "SREcon26 Americas", "premise": "SRE teams spend immense effort measuring Mean Time to Detect (MTTD) and Mean Time to Mitigate (MTTM), but consistently ignore the human developer experience and cognitive friction during outages. When engineers encounter opaque tooling, conflicting runbooks, or broken deployment pipelines during high-stress triage, cognitive overload skyrockets, resulting in prolonged outages and severe burnout.", "technical_depth": "Nicole Forsgren introduces developer experience (DevEx) frameworks into incident retrospectives:\n1. The SPACE Framework in Incident Response: Measuring Satisfaction, Performance, Activity, Communication, and Efficiency specifically within the incident lifecycle to pinpoint systemic friction.\n2. Cognitive Load During Triage: Distinguishing between intrinsic load (complexity of the outage itself) and extraneous load (wrestling with permissions, broken VPNs, confusing telemetry dashboards, or multi-tenant alert floods).\n3. Eliminating 'WTF' Milestones: Establishing post-incident timelines that explicitly chart moments of responder disorientation ('Why did this runbook say command X when the cluster uses Y?') and treating these cognitive traps as critical engineering defects.\n4. Feedback Loops for Platform Tooling: Transforming incident retrospectives from blame-free postmortems into direct feature backlogs for internal developer platform teams.", "takeaways": "\u2022 **Extraneous Friction Prolongs Outages:** Responders waste over 30% of incident triage battling access rights, broken dashboards, and outdated wikis rather than solving the outage.\n\u2022 **Audit Responder Disorientation:** Track every 'WTF' moment in the post-incident timeline to prioritize operational toil reduction.\n\u2022 **Standardize Triage Workflows:** Provide single-command diagnostic bundles to prevent responders from manually assembling context under high stress.\n\u2022 **Treat Internal SRE Tools as Tier-1 Products:** If an internal deployment or roll-back CLI has terrible UX, it will trigger catastrophic user errors during high-severity crises.", "word_count": 248, "has_transcript": true}, {"session_id": "Bg-U8NyeA24", "title": "Operationalizing Key Management for Regulatory Compliance and Emergency Response", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "Bg-U8NyeA24", "recording_link": "https://www.youtube.com/watch?v=Bg-U8NyeA24", "company": "Google", "speaker": "Swetha Srinivasan", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/srinivasan", "conference": "SREcon26 Americas", "premise": "Modern key management is a core SRE challenge, demanding verifiable control, continuous compliance, and a ready pipeline for emergency key rotations. Most large-scale systems fail to meet the strict SLOs and non-repudiable audit trails required by regulators and incident response teams.", "technical_depth": "Swetha Srinivasan (Google) explores production systems architecture and reliability mechanisms:\n\nDrawing from experience in the world\u2019s most stringent regulatory environments, this talk presents an SRE framework for building and operating \"compliance-native\" cryptographic systems. We deconstruct common failure modes in high-stakes operations like root key rotation, especially when driven by external triggers.\n\nAttendees will learn generalizable architectural patterns, including public key distribution and monitoring for identity keys. Discover how infrastructure built for deliberate compliance becomes your fastest tool in a security incident. This is for SREs and security architects moving beyond simply using cryptographic tools to guaranteeing the reliability and compliance of critical key management workflows.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 238, "has_transcript": true}, {"session_id": "RdFsNjXaeBo", "title": "Reliability Engineering for Hybrid Robot-Cloud Systems", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "RdFsNjXaeBo", "recording_link": "https://www.youtube.com/watch?v=RdFsNjXaeBo", "company": "Agility Robotics", "speaker": "Jeff Corpuz and Rian Bogle", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/corpuz", "conference": "SREcon26 Americas", "premise": "Robots as a Service: we deploy autonomous humanoid robots to perform tasks in warehouses. Our robot management software, which handles designing and running task workflows on fleets of robots, runs in AWS. For this talk, we will describe our journey developing a hybrid robot-cloud system, including how we used SRE practices to improve the reliability and stability of the RaaS deployments.", "technical_depth": "Jeff Corpuz and Rian Bogle (Agility Robotics) explores production systems architecture and reliability mechanisms:\n\nJeff Corpuz is a Senior Engineering Manager at Agility Robotics, where he leads the Compute Platform and Internal Services teams within the Infrastructure organization. With more than a decade of experience across startups and large enterprises, Jeff has driven the adoption of cloud-native patterns and thrived in creating a bit of organized chaos with Kubernetes. He joined the robotics industry for the fun of controlling robots from the cloud, and today focuses on building strong, empowered engineering teams that keep the infrastructure running smoothly, so he can spend more time sailing, snowboarding, or scuba diving in peace.\n\nRian Bogle is the Principal Architect for Cloud and Infrastructure at Agility Robotics, where he designs and builds scalable, cloud-native systems for next-generation robotics. With over 20 years of experience in software engineering, platform engineering, and high-performance computing, he has led high-performing teams driving digital transformation and cloud adoption. A product-focused engineering leader, Rian is passionate about helping organizations maximize the impact and value of their software engineering teams.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 227, "has_transcript": true}, {"session_id": "XmBX93GKw6c", "title": "Reliability Equilibrium: The Hidden Playbook behind SRE Influence", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "XmBX93GKw6c", "recording_link": "https://www.youtube.com/watch?v=XmBX93GKw6c", "company": "Microsoft Azure", "speaker": "Daria Barteneva", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/barteneva", "conference": "SREcon26 Americas", "premise": "Reliability and velocity often feel like opposing forces - but what if we treat them as strategic games? This talk reframes sociotechnical trade-offs through a game theory lens, using Nash equilibria, Stag Hunt, Public Goods, and Shapley value to model real-world SRE dynamics.", "technical_depth": "Daria Barteneva (Microsoft Azure) explores production systems architecture and reliability mechanisms:\n\nWe\u2019ll explore why, without shared decision models, teams default to fragile equilibria like \u201cfreeze all changes,\u201d and how mechanism design - error budgets, canary deployments, and progressive rollouts - can shift incentives toward safer, higher-utility outcomes.\n\nGrounded in SRE practice and backed by DevOps research, this session equips you to diagnose bad equilibria, design guardrails, and influence system-level behavior - not just symptoms. Learn how to apply cooperative and non-cooperative game theory to reliability engineering and craft strategies that scale across teams, products, and platforms.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 208, "has_transcript": true}, {"session_id": "DATk-ZbWqzE", "title": "So You Want a New Incident Commander\u2014Lessons from Building Incident Response Teams", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "DATk-ZbWqzE", "recording_link": "https://www.youtube.com/watch?v=DATk-ZbWqzE", "company": "Enova International", "speaker": "Vanessa Huerta Granda", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/huerta-granda", "conference": "SREcon26 Americas", "premise": "Incident Command isn\u2019t a badge for the most senior engineer. It\u2019s a sociotechnical leadership skill that keeps teams aligned, reduces cognitive load, and builds trust during outages. This talk shares lessons from a decade building IC programs across SRE organizations; including how to identify, train, and support effective Incident Commanders without burning out your best responders.", "technical_depth": "Vanessa Huerta Granda (Enova International) explores production systems architecture and reliability mechanisms:\n\nVanessa is a Technology Manager for Resilience Engineering at Enova. Previously she worked at Jeli.io helping companies make the most of their incidents. Vanessa has built and scaled incident command programs across multiple engineering organizations, training hundreds of engineers in high-pressure leadership, on-call operations, and outage communication. Her work focuses on the human side of reliability; creating sustainable practices that reduce burnout while improving resilience. She speaks frequently on incident command, SRE culture, and decision-making under uncertainty.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 133, "has_transcript": true}, {"session_id": "e0_TSfDM2XY", "title": "The Case of the Misnamed Cities: CAST Analysis of a Google Maps Incident", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "e0_TSfDM2XY", "recording_link": "https://www.youtube.com/watch?v=e0_TSfDM2XY", "company": "Google", "speaker": "Ruben Barroso", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/barroso", "conference": "SREcon26 Americas", "premise": "Traditional root-cause analysis (RCA) seeks a single broken component or human error, which is fundamentally inadequate for complex socio-technical systems. Google Maps experienced a severe data incident where multiple major cities were misnamed on the map. Applying Causal Analysis based on STAMP (CAST) uncovered the complex interactions, organizational feedback loops, and safety control structure gaps that permitted the failure.", "technical_depth": "Ruben Barroso (Google) presents the CAST investigation methodology applied to Google Maps:\n1. The Limits of 5 Whys and Linear Causality: Why asking 'who made the mistake?' obscures the systemic conditions that made the failure inevitable.\n2. Modeling the Safety Control Structure: Mapping the complete socio-technical hierarchy\u2014from software pipelines, validation bots, and automated canaries, up to engineering management, vendor training, and organizational SLO policies.\n3. Identifying Control Flaws & Feedback Failures: Revealing how automated validation checks passed because the corrupted city names were syntactically valid strings, while feedback channels between geographic data operators and automated pipelines were delayed.\n4. Systemic Interventions Over Blame: Redesigning semantic verification invariants, implementing geographical sanity bounds, and establishing rapid human-in-the-loop rollback mechanisms.", "takeaways": "\u2022 **Abandon Linear Root Cause:** Complex system failures are not caused by single components; they result from flawed interactions across the safety control structure.\n\u2022 **Syntax Checks Are Not Semantic Checks:** Valid string data can still represent catastrophic real-world errors; validate data semantics against real-world boundaries.\n\u2022 **Map the Safety Control Hierarchy:** Document which controllers (automated or human) are responsible for enforcing specific system safety constraints.\n\u2022 **Fix the System, Not the Person:** When an engineer makes a mistake, ask what systemic feedback or tooling was missing that allowed the mistake to proceed undetected.", "word_count": 163, "has_transcript": true}, {"session_id": "8-foszKUCOs", "title": "The Critical Resource Is You: Practical Destressing for On-Call Engineers", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "8-foszKUCOs", "recording_link": "https://www.youtube.com/watch?v=8-foszKUCOs", "company": "Adaptive Capacity Labs", "speaker": "Beth Adele Long", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/long", "conference": "SREcon26 Americas", "premise": "You know how to triage, diagnose, and resolve problems in your software and hardware systems \u2014 but can you do the same with your own biological stress response? In this talk we\u2019ll look at the physiological experience of chronic and acute stress: the slow burn of on-call rotations and the hyper-alertness of incident response. We\u2019ll address the observability challenge that makes it hard for many of us to notice stress before it becomes burnout. And we\u2019ll unpack a few simple but powerful ways to use biology in your favor to recover from even the most intense incident.", "technical_depth": "Beth Adele Long (Adaptive Capacity Labs) explores production systems architecture and reliability mechanisms:\n\nBeth Adele Long is a Principal at Adaptive Capacity Labs and founding board member of the Resilience in Software Foundation. She has held engineering and product roles at New Relic, Jeli.io, and Gruntwork. She coaches individuals and organizations in incident response and analysis, adaptive delivery and sustainable practices for operational work.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 148, "has_transcript": true}, {"session_id": "cvcGIr4a2Dk", "title": "The Ironies of AI\u00b2", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "cvcGIr4a2Dk", "recording_link": "https://www.youtube.com/watch?v=cvcGIr4a2Dk", "company": "Chime", "speaker": "J. Paul Reed", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/reed", "conference": "SREcon26 Americas", "premise": "We'll explore some of the \"ironies\" of automation\u2014and now, artificial intelligence\u2014in their interactions with software operators (i.e. you), especially during high consequence, high tempo situations (aka incidents).", "technical_depth": "J. Paul Reed (Chime) explores production systems architecture and reliability mechanisms:\n\nWe'll also look at considerations when building automation and integrating AI into your systems and workflows, including how we reason about them when they go awry and some food for thought on the role both AI and automation play in your next incident. Also? \"Fun\" incident stories!\n\nJ. Paul Reed began his career in the trenches as a build/release and operations engineer. After launching a successful boutique consulting firm, he now spends his days as a Staff Incident Operations Manager at Chime, focusing on incident response, analysis, and systemic risk identification. He's worked with such organization as VMware, Mozilla, Symantec, and Netflix.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 129, "has_transcript": true}, {"session_id": "Nd0xfNmkgRI", "title": "The Power of Stories", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "Nd0xfNmkgRI", "recording_link": "https://www.youtube.com/watch?v=Nd0xfNmkgRI", "company": "Airbnb", "speaker": "Lorin Hochstein", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/hochstein", "conference": "SREcon26 Americas", "premise": "We humans love stories, so much so that we both tell them and listen to them for fun. As SREs, our community has a particular fondness for incident stories.", "technical_depth": "Lorin Hochstein (Airbnb) explores production systems architecture and reliability mechanisms:\n\nIn this talk, I'll discuss how these kinds of incident stories make for a more effective tool for learning from incidents than bullet points or metric trends. We'll see how stories provide us with glimpses into the complexity of our system that we'd otherwise never see, and enable us to learn from the experiences of others. We'll explore what makes for an effective story, as well the dangers of stories that oversimplify the nature of complex system failure. And we'll look at how to foster an internal incident storytelling culture within an organization.\n\nLorin Hochstein is a Staff Software Engineer, Reliability at Airbnb. He was previously Senior Staff Software Engineer at Coupang, Senior Software Engineer at Netflix, Senior Software Engineer at SendGrid Labs, Lead Architect for Cloud Services at Nimbis Services, Computer Scientist at the University of Southern California's Information Sciences Institute, and Assistant Professor in the Department of Computer Science and Engineering at the University of Nebraska\u2013Lincoln.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 233, "has_transcript": true}, {"session_id": "CX3veJF5I2k", "title": "Three Lies We Tell Ourselves about Disaster Recovery and What to Do about Them", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "CX3veJF5I2k", "recording_link": "https://www.youtube.com/watch?v=CX3veJF5I2k", "company": "Resilience in Software Foundation", "speaker": "Colette Alexander", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/alexander", "conference": "SREcon26 Americas", "premise": "While many engineers and leaders participate in and sponsor disaster recovery (DR) activities at their companies, few ever need to wrestle with whether their DR systems will work in reality. This is because of the resilience and robustness of the systems they work within (and maybe a bit of luck). But what if we needed to use our DR plans in reality one day? What would happen then? Using real-life stories from the movies, the US defense department, and nuclear power we can illuminate what some of the weaknesses of our own DR plans are, and then come up with tactical and philosophical approaches to making DR exercises better for everyone.", "technical_depth": "Colette Alexander (Resilience in Software Foundation) explores production systems architecture and reliability mechanisms:\n\nColette has been working as an engineering leader in the software industry for 10+ years. Her obsession with learning from incidents and Resilience Engineering began while managing teams at Spotify. It eventually led her to pursue her Masters in Science at Lund University in Human Factors and Systems Safety. She has led organizations in SRE and observability at HashiCorp and Cognite. She also maintains an active composition and recording career as a rock cellist, and lives with her rescue dog, 2 kids and husband in Ann Arbor, Michigan.\n\nThe presentation emphasizes structured verification, empirical telemetry, and disciplined control loops to prevent systemic production degradation.", "takeaways": "\u2022 **Empirical Verification:** Base architectural decisions on real workload measurements and kernel-level metrics rather than static assumptions.\n\u2022 **Bounded Failure Domains:** Isolate components to prevent localized faults from triggering cascading failures across distributed infrastructure.\n\u2022 **Operational Automation:** Codify post-incident learnings and diagnostic procedures directly into automated CI/CD checks and runtime canaries.", "word_count": 199, "has_transcript": true}, {"session_id": "2bVJbb5wYzo", "title": "When the Cure Is Worse than the Disease: Metastability in Recovery", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "2bVJbb5wYzo", "recording_link": "https://www.youtube.com/watch?v=2bVJbb5wYzo", "company": "Meta; Aleksey Charapko, University of New Hampshire", "speaker": "Todd Porter", "usenix_url": "https://www.usenix.org/conference/srecon26americas/presentation/porter", "conference": "SREcon26 Americas", "premise": "Metastable failures are the most catastrophic failure modes in distributed systems: a transient perturbation (e.g., network hiccup or node restart) triggers a self-reinforcing feedback loop that persists even after the initial trigger has vanished. System recovery attempts\u2014such as retrying requests, auto-scaling new instances, or clearing caches\u2014often exacerbate the feedback loop, locking the system in an indefinite outage state.", "technical_depth": "Todd Porter (Meta) and Aleksey Charapko (Univ of New Hampshire) dissect metastability mechanisms and recovery patterns:\n1. Sustaining Loops & Amplification Factors: Identifying common feedback loops, including aggressive client retries, cold cache lock-storms, garbage collection pauses induced by queued RPCs, and crash-loop backoffs on overloaded dependencies.\n2. The Fallacy of Standard Recovery Playbooks: Demonstrating how auto-scaling fresh nodes during a metastable crash-loop worsens the failure by bombarding the backend with cold cache misses and connection handshake overhead.\n3. Circuit Breakers with Backpressure Induction: Halting request amplification by enforcing token-bucket rate limits and immediately dropping shed traffic with explicit non-retryable error codes.\n4. Controlled Warming & Sliced Cutovers: Engineering deterministic recovery sequences: draining client traffic, pre-warming internal caches with synthetic workloads, and gradually throttling production traffic back in percentage-based stages.", "takeaways": "\u2022 **Identify Metastable Loops Early:** If system health fails to recover after resolving the initial trigger, you are trapped in a metastable sustaining loop.\n\u2022 **Kill Aggressive Retries:** Uncapped exponential backoff without jitter amplifies overload into permanent collapse; use circuit breakers to reject retries at the edge.\n\u2022 **Cold Caches Kill Recoveries:** Never route full production traffic to freshly booted nodes; pre-warm local and distributed caches before registering instances to the load balancer.\n\u2022 **Embrace Intentional Brownouts:** Dropping non-critical traffic proactively allows core services to stabilize and break the feedback loop before catastrophic failure occurs.", "word_count": 196, "has_transcript": true}, {"session_id": "CzT29WhP404", "title": "AGI and SRE", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "CzT29WhP404", "recording_link": "https://www.youtube.com/watch?v=CzT29WhP404", "company": "Anthropic PBC", "speaker": "Alex Palcuie", "word_count": 4689, "has_transcript": true, "premise": "For two years the SRE industry has discussed how AI models are changing our jobs. What nobody has seriously discussed is what happens when a model becomes at least as good as an SRE at the core job like holding the pager, mitigating incidents, and even reasoning about production. This talk argues that scenario is plausible within your career. Frontier labs are already publishing reports on how their models help build their successors, a process the industry calls recursive self-improvement (RSI). The rest is about how to manage the transition and what SRE becomes once the models are good enough. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Alex Palcuie (Anthropic PBC) outlines the production architecture and failure mitigations:\nDevelopers producing exponentially more code, models still lacking understanding of correlation versus causation which us humans also lose during incidents. I know this is unthinkable for a big part of our industry, but it was just as unthinkable two or three years ago that AI models could write functional code, test it, sometimes write it to production, as good, if not better, than the average software engineer. Before that, I spent eight years at Google as an SRE on the Google Compute Engine team, and I was also an incident commander on the teams that SREs call when an outage is bad enough that they want backup. From a reliability engineering's perspective, the model still cannot be left alone in a production environment.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "b0PKuM6h2Qc", "title": "All Gas, No Brakes, No Tears: Rebooting SRE for the AI...", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "b0PKuM6h2Qc", "recording_link": "https://www.youtube.com/watch?v=b0PKuM6h2Qc", "company": "Duolingo", "speaker": "Maggie Hewitt", "word_count": 3312, "has_transcript": true, "premise": "The \"Hot AI Summer of 2025\" was not kind to our status page. In August 2025, engineers at Duolingo had more than 2x as many lines of new code to review per active engineer as the previous August. Meanwhile, we had 4 engineers with the title \"SRE,\" an SRE-to-engineer ratio of roughly 1:120, and no real centralized SRE org. This talk covers how we rebooted SRE for an engineering org that was shipping faster than ever: moving SREs closer to product teams, aligning reliability work to business goals, making incident command less terrifying, and using AI to reduce review toil on low-risk PRs. Attendees will leave with practical ideas for scaling reliability work when velocity goes up and SRE headcount does not. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Maggie Hewitt (Duolingo) outlines the production architecture and failure mitigations:\nAnd this is our public status page and some incident counts. And one thing to note is actually none of those incidents were related to directly related to AI code going to prod. Uh, we still had downtime and incidents and not that amazing. There's a lot of people trying to answer that question right now, but I can very confidently say we suddenly had more stuff being merged and deployed to production.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "BA2hqZZK0ec", "title": "Are You Talking to Me? Confidence Entanglement in...", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "BA2hqZZK0ec", "recording_link": "https://www.youtube.com/watch?v=BA2hqZZK0ec", "company": "Stevens Institute of Technology", "speaker": "Brian Moriarty", "word_count": 1620, "has_transcript": true, "premise": "When an operator and an AI assistant work a problem together, their confidence signals get tangled. The assistant sounds equally smooth whether it is right or wrong, and that polish is easy to read as agreement. The operator's own doubt tends to fade to match it. Nothing in the interaction flags the difference. The dashboards stay green, the responses keep coming, and the review step still happens on paper, but the operator has stopped independently judging the output. This talk walks through how confidence entanglement shows up in AI-assisted operations, why it is so hard to catch while it is happening, and what it tends to look like only afterward. It offers a few concrete checks teams can apply to their own workflows to tell whether a human is still doing the judging, or just agreeing. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Brian Moriarty (Stevens Institute of Technology) outlines the production architecture and failure mitigations:\nUm you've been on incident call where the team closes around the diagnosis. It reads from the same run books, tickets, incident channel that you do. &gt;&gt; [clears throat] &gt;&gt; The problem goes beyond agreement or the vastly overused sick and see we hear so much about. The same team may design the prompts, instrumentation, and review.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "ERxQDqtTa_4", "title": "Beyond Blast Radius: Dimensions of...", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "ERxQDqtTa_4", "recording_link": "https://www.youtube.com/watch?v=ERxQDqtTa_4", "company": "Bloomberg", "speaker": "Nevil Shah", "word_count": 2064, "has_transcript": true, "premise": "While \"blast radius\" is a foundational concept for quantifying how far an incident spreads, traditional assessments often focus solely on breadth, or the count of impacted services or users. However, in practice, the severity of an incident is best assessed by also taking into account its depth, or the degree to which systems are driven into a \"bad state\" and the lingering, reverberating effects that persist long after the initial trigger is resolved. Hence, this talk will introduce a multi-dimensional framework for assessing failure impact. It will expand on the traditional view of \"blast radius\" by formalizing the concepts of Impact Breadth, Impact Depth, and Recovery Complexity. View the full SREcon26 Europe/Middle East/Africa program at https://www.usenix.org/conference/srecon26emea/program", "technical_depth": "Nevil Shah (Bloomberg) outlines the production architecture and failure mitigations:\nUm so, first off, it refers to the extent of applications and users that are affected by an incident or mishap, right. Where yeah, if their downstream service or database is not working, then it will fall back to a cache for the time being. But what truly happens in the face of an incident. Um and already like folks can probably think about potential failure scenarios here and there like um you could have bad or corrupted data in the SFTP upload that the merchant sends.\n\nThe presentation emphasizes structured boundaries, empirical telemetry verification, and rigorous operational control loops to defend against systemic outages.", "takeaways": "\u2022 **Failure Domain Isolation:** Partition critical service components into bounded failure domains to mitigate blast radius during major infrastructure degradation.\n\u2022 **Empirical Telemetry Verification:** Never rely on static assumptions or aggregated averages; observe high-resolution percentiles and kernel-level trace points.\n\u2022 **Continuous Operational Discipline:** Codify operational postmortem learnings directly into automated CI/CD regression tests and live validation canaries.", "conference": "SREcon26 EMEA", "usenix_url": "https://www.usenix.org/conference/srecon26emea/program"}, {"session_id": "pJMVTKyPbhM", "title": "Defence in Depth: How We Secured our SDLC System...", "category": "Incident Management, Forensics & Resilience", "topic": "Incident Management, Forensics & Resilience", "type": "Breakout", "video_id": "pJMVTKyPbhM", "recording_link": "https://www.youtube.com/watch?v=pJMVTKyPbhM", "company": "Grafana Labs", "speaker": "Tony Leopold and Philip Hope", "word_count": 5140, "has_transcript": true, "premise": "In this talk we describe the large enterprise scale we operate at and the need for secure SDLC tooling in an OSS context. We discuss: * details of a supply chain attack to which we were vulnerable, including the attack chain * a timeline of detection and response activities * how we got lucky and what we needed to do to secure our SDLC systems on the back of this attack * how we hardened our secrets management * how we hardened our CI/CD and runner infrastructure * regionalisation, isolation, and attack surface reduction * SDLC tooling hardening
